<title>قطار زيانه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Lalezar&display=swap">
<style>
/* Layout: one-screen game — sky scene with Zayana's speech card on top, the train on rails in the middle, digit cards below. Single bright daytime look by choice. */
:root{
  --sky-top:#8fd3f4; --sky-bot:#fdebc8; --sand:#e9b872; --sand-dark:#c98f4a;
  --oman-red:#c8102e; --oman-green:#0f8a43; --ink:#2a1a12; --paper:#fffaf0;
  --gold:#e3a72f; --rail:#5b4636; --wrong:#d62839; --right:#1b9e55;
  --display:"Lalezar","Baloo Bhaijaan 2",Tahoma,sans-serif;
  --body:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky-top),var(--sky-bot) 62%,var(--sand) 62%);color:var(--ink);font-family:var(--body);font-size:16px;overflow-x:hidden}
.game{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,40px);margin:0;color:var(--oman-red);text-shadow:2px 2px 0 var(--paper);letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.chip button{all:unset;cursor:pointer}
.chip:has(button:focus-visible){outline:3px solid var(--oman-green)}
/* Zayana + bubble */
.host{display:flex;align-items:flex-end;gap:10px;min-height:150px}
.zay{width:104px;flex:none;transform-origin:50% 100%}
.zay-svg{width:100%;height:auto;display:block}
.zay.cheer{animation:hop .5s ease-in-out 3}
.zay.sad{animation:tilt .6s ease-in-out}
@keyframes hop{50%{transform:translateY(-22px) scaleY(1.04)}}
@keyframes tilt{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-size:clamp(16px,4.2vw,20px);font-weight:700;line-height:1.5;margin-bottom:40px;box-shadow:4px 4px 0 rgba(42,26,18,.25)}
.bubble::after{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble small{display:block;font-weight:500;font-size:.82em;color:#6b4a35}
.expand{direction:ltr;unicode-bidi:isolate;display:inline-block;color:var(--oman-green)}
/* target number */
.target{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.target .label{font-weight:700}
.num{direction:ltr;font-family:var(--display);font-size:clamp(46px,13vw,72px);line-height:1;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px 20px 0;letter-spacing:.06em;font-variant-numeric:tabular-nums}
/* scene + train */
.scene{position:relative;overflow:hidden;padding:26px 0 0}
.station{position:absolute;top:0;right:4px;background:var(--oman-green);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 12px;font-weight:800;font-size:15px}
.mountains{position:absolute;inset:auto 0 46px 0;height:60px;opacity:.5}
.train{position:relative;direction:ltr;display:flex;align-items:flex-end;gap:6px;transition:transform 1.1s cubic-bezier(.5,0,.5,1)}
.train.leave{transform:translateX(130%)}
.train.enter{transition:none;transform:translateX(-130%)}
.wagon{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
.car{position:relative;width:100%;aspect-ratio:1/0.9;max-width:120px;border:3px solid var(--ink);border-radius:12px 12px 6px 6px;display:flex;align-items:center;justify-content:center}
.car::before,.car::after{content:"";position:absolute;bottom:-14px;width:22px;height:22px;border-radius:50%;background:#3b2a20;border:3px solid var(--ink);box-shadow:inset 0 0 0 4px #8a7666}
.car::before{left:12%}.car::after{right:12%}
.w-0 .car{background:#2f6fd0}.w-1 .car{background:#8c4fc4}.w-2 .car{background:var(--gold)}.w-3 .car{background:var(--oman-green)}
.slot{width:70%;aspect-ratio:1;max-width:66px;background:var(--paper);border:3px dashed var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(26px,7vw,40px);padding-top:4px}
.wagon.filled .slot{border-style:solid}
.wagon.good .slot{background:#d6f5e1;border-color:var(--right)}
.wagon.bad .slot{background:#fde0e3;border-color:var(--wrong)}
.wagon.bad .car{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.plate{margin-top:14px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;font-size:clamp(13px,3.4vw,16px);white-space:nowrap;direction:rtl}
.wagon:focus-visible .car{outline:4px solid var(--oman-red);outline-offset:3px}
.loco{flex:1.35;min-width:0;max-width:150px}
.loco svg{width:100%;height:auto;display:block}
.puff{animation:puff 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
.puff.p2{animation-delay:.55s}.puff.p3{animation-delay:1.1s}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-26px,-40px) scale(1.6)}}
.rails{height:16px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--rail) 0 8px,transparent 8px 30px);border-top:5px solid #7d6a5b;border-bottom:5px solid #7d6a5b}
/* cards */
.tray{direction:ltr;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:84px;padding:10px;border-radius:18px;background:rgba(255,250,240,.55);border:2px dashed var(--sand-dark)}
.card{width:64px;height:72px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-family:var(--display);font-size:40px;padding-top:6px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .12s;color:var(--ink)}
.card:hover{transform:translateY(-3px)}
.card.sel{background:#ffe08a;transform:translateY(-8px);box-shadow:0 10px 0 var(--ink)}
.card:focus-visible{outline:4px solid var(--oman-red);outline-offset:3px}
.tray-empty{direction:rtl;align-self:center;font-weight:700;color:#7a5a43}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.go{font-family:var(--display);font-size:26px;padding:8px 34px 2px;border:3px solid var(--ink);border-radius:999px;background:var(--oman-red);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.go:disabled{background:#c9b8a8;color:#f5ede4;cursor:not-allowed}
.go:focus-visible,.ghost:focus-visible{outline:4px solid var(--oman-green);outline-offset:3px}
.ghost{font:700 16px var(--body);padding:8px 18px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);cursor:pointer;color:var(--ink)}
.dates{font-size:15px;text-align:center;color:#6b4a35;font-weight:600}
.setup{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(42,26,18,.55);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.setup[hidden]{display:none}
.setup-card{width:100%;max-width:420px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 rgba(42,26,18,.35)}
.setup-card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--oman-red)}
.setup-card p{margin:0;font-weight:600;line-height:1.6}
.setup-card label{font-weight:800}
.setup-card input{font:700 22px var(--body);padding:8px 14px;border:3px solid var(--ink);border-radius:14px;width:100%;background:#fff;color:var(--ink)}
.setup-card input:focus-visible{outline:4px solid var(--oman-green);outline-offset:2px}
.kind{display:flex;gap:10px}
.kind button{flex:1;font:800 18px var(--body);padding:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink)}
.kind button[aria-pressed="true"]{background:#ffe08a}
.kind button:focus-visible{outline:4px solid var(--oman-green);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .go{flex:1}
@media (max-width:440px){.zay{width:84px}.host{min-height:126px}.card{width:54px;height:62px;font-size:34px}.gap-hide{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <section class="tray" id="tray" aria-label="بطاقات الأرقام"></section>

  <div class="actions">
    <button class="go" id="go" disabled>انطلق! 🚂</button>
    <button class="ghost" id="reset">رجّع البطاقات</button>

  <section class="setup" id="setup" hidden>

      <div class="kind" role="group" aria-label="ولد أو بنت">

      </div>
      <div class="row">

        <button type="button" class="ghost" id="try-voice">🔊 اسمع زيانه</button>
      </div>
      <p class="dates" id="voice-note"></p>
    </form>
  </section>

  <p class="dates">كل رحلة صحيحة تعطيك تمرة 🌴<br>و٣ رحلات صح ورى بعض تطلّعك للمستوى اللي بعده</p>
</div>

<script>
(() => {
  const PLACES = ['آحاد','عشرات','مئات','ألوف'];
  const STATIONS = ['مسقط','نزوى','صور','صحار','صلالة','خصب','بهلاء','مطرح','الجبل الأخضر','عبري','الرستاق','مصيرة'];
    const AR = '٠١٢٣٤٥٦٧٨٩';
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try { const v = localStorage.getItem('zayana-train-'+k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem('zayana-train-'+k, JSON.stringify(v)); } catch {} }
  };
  let st = { level: store.get('level',1), dates: store.get('dates',0), station: store.get('station',0), streak: 0, arabic: store.get('arabic',true), sound: store.get('sound',true), name: store.get('name',''), girl: store.get('girl',true) };
  let round = null, selected = null, busy = false;

  const fmt = n => { const s = String(n); return st.arabic ? s.replace(/\d/g, d => AR[d]) : s; };
  const nDigits = () => Math.min(4, st.level + 1);

  // tiny sounds (start after first tap)
  let ac = null;
  function beep(freqs, dur = .12){
    if (!st.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f,i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*dur;
        o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t+dur*1.6);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur*1.7);
      });
    } catch {}
  }

  // ---- Zayana's voice (the device's Arabic text-to-speech) ----
  const tts = window.speechSynthesis;
  let voice = null;
  function pickVoice(){
    if (!tts) return;
    const vs = tts.getVoices().filter(v => /^ar/i.test(v.lang));
    const female = /female|laila|layla|hoda|salma|zariyah|fatima|amira|hala|mona|noura|sana|zeina|maryam/i;
    const gulf = /ar-(om|ae|sa|kw|qa|bh)/i;
    voice = vs.find(v => female.test(v.name) && gulf.test(v.lang)) || vs.find(v => female.test(v.name)) || vs.find(v => gulf.test(v.lang)) || vs[0] || null;
  }
  if (tts) { pickVoice(); tts.addEventListener?.('voiceschanged', pickVoice); }
  function speak(text){
    if (!st.sound || !tts) return;
    try {
      tts.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').trim());
      u.lang = voice ? voice.lang : 'ar-SA'; if (voice) u.voice = voice;
      u.rate = 0.95; u.pitch = 1.3;
      tts.speak(u);
    } catch {}
  }
  const nm = () => st.name.trim();
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function praise(){
    const n = nm(), g = st.girl;
    const you = n ? 'يا ' + n : (g ? 'يا بطلة' : 'يا بطل');
    return pick(g ? [
      'عاشت إيدك ' + you + '! كمّلي يا الغالية',
      'ما شاء الله عليك ' + you + '، شاطرة!',
      'يلا ' + (n || 'يا بطلة') + '، أحسنتِ! كمّلي',
      'زين زين ' + you + '، أنتِ بطلة!',
      'الله يحفظك ' + you + '، صح عليك!'
    ] : [
      'عاشت إيدك ' + you + '! كمّل يا الغالي',
      'ما شاء الله عليك ' + you + '، شاطر!',
      'يلا ' + (n || 'يا بطل') + '، أحسنت! كمّل',
      'زين زين ' + you + '، أنت بطل!',
      'الله يحفظك ' + you + '، صح عليك!'
    ]);
  }
  function oops(){
    const n = nm(), g = st.girl;
    return (n ? 'ما عليه يا ' + n : 'ما عليه') + (g ? '، حاولي مرة ثانية' : '، حاول مرة ثانية');
  }
  function levelUp(){
    const n = nm(), g = st.girl;
    return 'واو' + (n ? ' يا ' + n : '') + '! ' + (g ? 'طلعتي' : 'طلعت') + ' للمستوى ' + st.level;
  }

  function say(html){ $('bubble').innerHTML = html; }
  function zay(cls){ const z = $('zay'); z.classList.remove('cheer','sad'); void z.offsetWidth; if (cls) z.classList.add(cls); }

  function newRound(){
    const k = nDigits();
    const digits = [1 + Math.floor(Math.random()*9)];
    for (let i = 1; i < k; i++) digits.push(Math.floor(Math.random()*10));
    // digits[0] is the highest place
    const cards = digits.map((d,i) => ({ id: 'c'+i+'-'+Math.random().toString(36).slice(2,6), d }));
    for (let i = cards.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [cards[i],cards[j]] = [cards[j],cards[i]]; }
    round = { digits, cards, placed: Array(k).fill(null), checked: null };
    selected = null;
    render();
  }

  function cardById(id){ return round.cards.find(c => c.id === id); }

  function render(){
    const k = round.digits.length;
    $('num').textContent = fmt(round.digits.join(''));
    $('chip-dates').textContent = '🌴 ' + fmt(st.dates);
    $('chip-level').textContent = 'المستوى ' + fmt(st.level);
    $('station').textContent = 'المحطة: ' + STATIONS[st.station % STATIONS.length];
    $('btn-player').textContent = '👤 ' + (nm() || 'لاعب');
    $('btn-sound').textContent = st.sound ? '🔊' : '🔇';
    // wagons: left→right = highest place → ones (matches how the number is written)
    const w = $('wagons'); w.innerHTML = '';
    for (let pos = 0; pos < k; pos++) {
      const place = k - 1 - pos;
      const cid = round.placed[pos];
      const b = document.createElement('button');
      b.className = 'wagon w-' + place + (cid ? ' filled' : '') + (round.checked ? (round.checked[pos] ? ' good' : ' bad') : '');
      b.setAttribute('aria-label', 'عربة ' + PLACES[place] + (cid ? '، فيها ' + fmt(cardById(cid).d) : '، فاضية'));
      b.innerHTML = '<span class="car"><span class="slot">' + (cid ? fmt(cardById(cid).d) : '') + '</span></span><span class="plate">' + PLACES[place] + '</span>';
      b.onclick = () => tapWagon(pos);
      w.appendChild(b);
    }
    const t = $('tray'); t.innerHTML = '';
    const free = round.cards.filter(c => !round.placed.includes(c.id));
    if (!free.length) { const s = document.createElement('span'); s.className = 'tray-empty'; s.textContent = 'كل البطاقات في القطار، اضغط انطلق!'; t.appendChild(s); }
    free.forEach(c => {
      const b = document.createElement('button');
      b.className = 'card' + (selected === c.id ? ' sel' : '');
      b.textContent = fmt(c.d);
      b.setAttribute('aria-pressed', selected === c.id);
      b.setAttribute('aria-label', 'بطاقة ' + fmt(c.d));
      b.onclick = () => { if (busy) return; selected = selected === c.id ? null : c.id; beep([520]); render(); };
      t.appendChild(b);
    });
    $('go').disabled = busy || round.placed.includes(null);
  }

  function tapWagon(pos){
    if (busy) return;
    round.checked = null;
    if (selected) {
      round.placed[pos] = selected; // a card already there goes back to the tray automatically
      selected = null; beep([660]);
    } else if (round.placed[pos]) {
      round.placed[pos] = null; beep([380]);
    } else {
      say('اختار بطاقة رقم أول، وبعدها اضغط على العربة 👇');
    }
    render();
  }

  function expanded(){
    const k = round.digits.length;
    const parts = round.digits.map((d,i) => d * 10 ** (k-1-i)).filter(v => v > 0).map(fmt);
    return '<span class="expand">' + fmt(round.digits.join('')) + ' = ' + parts.join(' + ') + '</span>';
  }

  function go(){
    if (busy) return;
    const k = round.digits.length;
    round.checked = round.placed.map((cid,pos) => cardById(cid).d === round.digits[pos]);
    if (round.checked.every(Boolean)) {
      busy = true; render();
      st.dates++; st.streak++;
      let up = false;
      if (st.streak >= 3 && st.level < 3) { st.level++; st.streak = 0; up = true; }
      const next = STATIONS[(st.station + 1) % STATIONS.length];
      const line = praise();
      say(line + ' 🌟<small>' + expanded() + '<br>رايحين ' + next + (up ? '، و' + (st.girl ? 'طلعتي' : 'طلعت') + ' للمستوى ' + fmt(st.level) + '! عربة جديدة انضافت 🚃' : '') + '</small>');
      zay('cheer'); beep([523,659,784,1046], .13);
      setTimeout(() => speak(up ? line + '. ' + levelUp() : line), 450);
      const tr = $('train');
      setTimeout(() => { tr.classList.add('leave'); beep([300,300], .25); }, 900);
      setTimeout(() => {
        st.station++;
        store.set('level', st.level); store.set('dates', st.dates); store.set('station', st.station);
        tr.classList.remove('leave'); tr.classList.add('enter');
        newRound(); void tr.offsetWidth; tr.classList.remove('enter');
        busy = false; render();
      }, 2100);
    } else {
      st.streak = 0;
      const pos = round.checked.findIndex(ok => !ok);
      const place = k - 1 - pos;
      const want = round.digits[pos];
      say(oops() + ' 💪<small>الرقم ' + fmt(want) + ' مكانه في عربة ال' + PLACES[place] + '. العربات الحمراء تحتاج تعديل.</small>');
      zay('sad'); beep([330,247], .18);
      setTimeout(() => speak(oops()), 350);
      render();
    }
  }

  $('go').onclick = go;
  $('reset').onclick = () => { if (busy) return; round.placed.fill(null); round.checked = null; selected = null; render(); };
  $('btn-digits').onclick = () => { st.arabic = !st.arabic; store.set('arabic', st.arabic); render(); };
  $('btn-sound').onclick = () => { st.sound = !st.sound; store.set('sound', st.sound); render(); };

  // ---- player setup ----
  let girlSel = st.girl;
  function kindUI(){ $('k-girl').setAttribute('aria-pressed', girlSel); $('k-boy').setAttribute('aria-pressed', !girlSel); }
  function openSetup(){
    $('pname').value = st.name; girlSel = st.girl; kindUI();
    $('voice-note').textContent = tts ? '' : 'جهازك ما يدعم الصوت، بتشوف كلام زيانه مكتوب بس.';
    $('setup').hidden = false; setTimeout(() => $('pname').focus(), 50);
  }
  $('k-girl').onclick = () => { girlSel = true; kindUI(); };
  $('k-boy').onclick = () => { girlSel = false; kindUI(); };
  $('try-voice').onclick = () => {
    const n = $('pname').value.trim();
    const keep = { name: st.name, girl: st.girl };
    st.name = n; st.girl = girlSel; const was = st.sound; st.sound = true;
    pickVoice(); speak('هلا والله' + (n ? ' يا ' + n : '') + '! أنا زيانه، يلا نركب القطار');
    st.sound = was; st.name = keep.name; st.girl = keep.girl;
    if (tts && !voice) $('voice-note').textContent = 'ما لقيت صوت عربي في جهازك، ممكن يطلع الصوت بلكنة ثانية.';
  };
  $('setup-form').onsubmit = ev => {
    ev.preventDefault();
    st.name = $('pname').value.trim().slice(0, 20); st.girl = girlSel;
    store.set('name', st.name); store.set('girl', st.girl);
    $('setup').hidden = true;
    const hi = 'هلا والله' + (st.name ? ' يا ' + st.name : '') + '! أنا زيانه سايقة القطار';
    say(hi + ' 🚂<small>حط كل رقم في عربته الصح: الآحاد، العشرات، المئات، الألوف.</small>');
    speak(hi + '، يلا نبدأ!');
    render();
  };
  $('btn-player').onclick = openSetup;

  newRound();
  if (store.get('name', null) === null) openSetup();
})();
</script>
