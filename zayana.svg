<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620">
  <title>زيانه — Zayana in traditional Omani dress</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e0"/><stop offset="1" stop-color="#ffe0b8"/>
    </linearGradient>
    <linearGradient id="lihaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7263d"/><stop offset="1" stop-color="#a5122a"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/><stop offset="1" stop-color="#136b38"/>
    </linearGradient>
    <pattern id="embroidery" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f2c14e"/>
      <path d="M8 1 L15 8 L8 15 L1 8 Z" fill="#d7263d"/>
      <circle cx="8" cy="8" r="2" fill="#fff"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="2.2" fill="#f2c14e" opacity=".85"/>
    </pattern>
  </defs>

  <rect width="400" height="620" rx="28" fill="url(#bg)"/>
  <!-- sun & dunes -->
  <circle cx="320" cy="90" r="42" fill="#ffd166" opacity=".7"/>
  <path d="M0 520 Q100 470 200 515 T400 505 V620 H0Z" fill="#f4b46a" opacity=".6"/>

  <!-- back of lihaf (headscarf) flowing -->
  <path d="M120 150 Q100 300 112 400 L288 400 Q300 300 280 150 Z" fill="url(#lihaf)"/>
  <path d="M120 150 Q100 300 112 400 L288 400 Q300 300 280 150 Z" fill="url(#dots)"/>

  <!-- dishdasha (dress) -->
  <path d="M135 300 Q120 420 100 540 L300 540 Q280 420 265 300 Q200 280 135 300Z" fill="url(#dress)"/>
  <!-- embroidered hem -->
  <path d="M104 515 L296 515 L300 540 L100 540Z" fill="url(#embroidery)"/>
  <!-- embroidered centre panel -->
  <rect x="190" y="300" width="20" height="215" fill="url(#embroidery)"/>

  <!-- sleeves & arms -->
  <path d="M140 305 Q105 360 112 430 L140 430 Q140 370 160 330Z" fill="url(#dress)"/>
  <path d="M260 305 Q295 360 288 430 L260 430 Q260 370 240 330Z" fill="url(#dress)"/>
  <rect x="110" y="420" width="32" height="14" rx="3" fill="url(#embroidery)"/>
  <rect x="258" y="420" width="32" height="14" rx="3" fill="url(#embroidery)"/>
  <circle cx="126" cy="448" r="14" fill="#e8b38a"/>
  <!-- waving hand -->
  <circle cx="274" cy="448" r="14" fill="#e8b38a"/>
  <!-- henna dots -->
  <circle cx="122" cy="448" r="2" fill="#a0461f"/><circle cx="130" cy="452" r="2" fill="#a0461f"/>
  <circle cx="274" cy="446" r="2" fill="#a0461f"/><circle cx="279" cy="452" r="2" fill="#a0461f"/>

  <!-- sirwal (embroidered trousers) & feet -->
  <rect x="150" y="540" width="40" height="26" fill="url(#embroidery)"/>
  <rect x="210" y="540" width="40" height="26" fill="url(#embroidery)"/>
  <ellipse cx="165" cy="572" rx="26" ry="9" fill="#7a3b14"/>
  <ellipse cx="235" cy="572" rx="26" ry="9" fill="#7a3b14"/>

  <!-- neck + embroidered collar -->
  <rect x="185" y="262" width="30" height="40" fill="#e8b38a"/>
  <path d="M160 298 Q200 330 240 298 L232 290 Q200 316 168 290Z" fill="url(#embroidery)"/>

  <!-- face -->
  <ellipse cx="200" cy="205" rx="68" ry="74" fill="#f0c29b"/>
  <!-- front of lihaf framing face -->
  <path d="M128 200 Q125 110 200 100 Q275 110 272 200 Q270 140 200 132 Q130 140 128 200Z" fill="url(#lihaf)"/>
  <path d="M128 200 Q125 110 200 100 Q275 110 272 200 Q270 140 200 132 Q130 140 128 200Z" fill="url(#dots)"/>
  <path d="M128 200 Q118 260 150 300 L140 300 Q105 250 122 190Z" fill="url(#lihaf)"/>
  <path d="M272 200 Q282 260 250 300 L260 300 Q295 250 278 190Z" fill="url(#lihaf)"/>
  <!-- gold trim on lihaf edge -->
  <path d="M132 196 Q132 142 200 136 Q268 142 268 196" fill="none" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/>
  <!-- silver forehead jewellery -->
  <path d="M168 145 Q200 160 232 145" fill="none" stroke="#cfd8dc" stroke-width="3"/>
  <circle cx="200" cy="156" r="6" fill="#cfd8dc" stroke="#90a4ae"/>
  <circle cx="200" cy="156" r="2.5" fill="#d7263d"/>

  <!-- hair fringe -->
  <path d="M150 160 Q175 150 200 165 Q225 150 250 160 Q240 145 200 142 Q160 145 150 160Z" fill="#2b1a12"/>

  <!-- eyes -->
  <ellipse cx="174" cy="205" rx="13" ry="16" fill="#fff"/>
  <ellipse cx="226" cy="205" rx="13" ry="16" fill="#fff"/>
  <circle cx="176" cy="208" r="9" fill="#3b2314"/>
  <circle cx="228" cy="208" r="9" fill="#3b2314"/>
  <circle cx="179" cy="204" r="3" fill="#fff"/>
  <circle cx="231" cy="204" r="3" fill="#fff"/>
  <!-- kohl lashes -->
  <path d="M160 196 Q174 186 188 196" fill="none" stroke="#1a0f0a" stroke-width="3" stroke-linecap="round"/>
  <path d="M212 196 Q226 186 240 196" fill="none" stroke="#1a0f0a" stroke-width="3" stroke-linecap="round"/>
  <path d="M158 194 l-5 -4 M242 194 l5 -4" stroke="#1a0f0a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- brows -->
  <path d="M162 180 Q174 173 188 178" fill="none" stroke="#2b1a12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 178 Q226 173 238 180" fill="none" stroke="#2b1a12" stroke-width="3.5" stroke-linecap="round"/>
  <!-- cheeks, nose, smile -->
  <ellipse cx="160" cy="235" rx="11" ry="7" fill="#f28b82" opacity=".55"/>
  <ellipse cx="240" cy="235" rx="11" ry="7" fill="#f28b82" opacity=".55"/>
  <path d="M198 222 Q202 230 197 232" fill="none" stroke="#c98f66" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M182 245 Q200 262 218 245" fill="#b23a48" stroke="#8c2a36" stroke-width="2" stroke-linejoin="round"/>
  <!-- silver earrings -->
  <circle cx="133" cy="232" r="5" fill="#cfd8dc" stroke="#90a4ae"/>
  <circle cx="267" cy="232" r="5" fill="#cfd8dc" stroke="#90a4ae"/>

  <!-- name banner -->
  <rect x="120" y="582" width="160" height="30" rx="15" fill="#d7263d"/>
  <text x="200" y="604" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">زيانه · Zayana</text>
</svg>
