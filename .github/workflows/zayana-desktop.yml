name: Build Zayana Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/zayana-desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - name: Keep the installer as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: Zayana-Setup
          path: desktop/dist/Zayana-Setup.exe
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zayana-desktop-v${{ steps.v.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "Zayana Desktop ${{ steps.v.outputs.version }}" \
              --notes "زيانه على سطح المكتب 🧕 نزّل Zayana-Setup.exe وافتحه.
          Based on Khalfan by Ahmed Al Araimi — https://github.com/Ahmed-Al-Araimi/khalfan"
          fi
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/Zayana-Setup.exe --clobber; then echo "uploaded"; exit 0; fi
            echo "upload failed (try $i), waiting..."; sleep $((i * 15))
          done
          exit 1
