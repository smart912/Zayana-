<script>
// ============================================================
//  ألبوم الولايات — كل محافظات وولايات عُمان
//  1080x1920, 21s. render(t) is a pure function of t.
//  NOTE: wilayat.html is generated from wilayat.src.html by build_album.py
//        (it inlines the shared helpers from reel.html).
// ============================================================
const W = 1080, H = 1920, FPS = 30; let DURATION = 72;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const RED = '#d8232f', GREEN = '#0f8a43', WHITE = '#ffffff', GOLD = '#f2c14e';

// ---------- text ----------
function text(str, x, y, o = {}) {
  const size = o.size || 100, font = o.font || 'Lalezar';
  ctx.save();
  ctx.translate(x, y);
  if (o.scale) ctx.scale(o.scale, o.scale);
  if (o.rot) ctx.rotate(o.rot);
  ctx.font = `${o.weight || ''} ${size}px "${font}"`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.reveal != null && o.reveal < 1) {          // wipe in from the right (RTL)
    const w = ctx.measureText(str).width + size;
    ctx.beginPath(); ctx.rect(w / 2 - w * o.reveal, -size * 1.5, w * o.reveal, size * 3); ctx.clip();
  }
  if (o.split) {                                    // chromatic split
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(216,35,47,.9)'; ctx.fillText(str, -o.split, 0);
    ctx.fillStyle = 'rgba(15,180,80,.9)'; ctx.fillText(str, o.split, 0);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 40; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || size * .12; ctx.strokeStyle = o.stroke; ctx.strokeText(str, 0, 0); }
  ctx.shadowBlur = 0;
  let fill = o.fill || WHITE;
  if (fill === 'gold') {
    const g = ctx.createLinearGradient(0, -size * .5, 0, size * .5);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(.45, '#f6c851'); g.addColorStop(1, '#c98a1a');
    fill = g;
  }
  ctx.fillStyle = fill; ctx.fillText(str, 0, 0);
  ctx.restore();
}

// ---------- Oman flag ----------
function drawEmblem(c, s) {          // national emblem, simplified, white, centred at 0,0, ~s tall
  c.save(); c.scale(s / 100, s / 100);
  c.fillStyle = '#fff'; c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineJoin = 'round';
  // two crossed curved swords
  for (const d of [1, -1]) {
    c.save(); c.scale(d, 1);
    c.lineWidth = 7;
    c.beginPath(); c.moveTo(-38, -40); c.quadraticCurveTo(-8, 0, 34, 38); c.stroke();
    c.lineWidth = 4;
    c.beginPath(); c.moveTo(-46, -34); c.lineTo(-30, -48); c.stroke();      // hilt guard
    c.beginPath(); c.arc(-44, -50, 5, 0, Math.PI * 2); c.fill();          // pommel
    c.restore();
  }
  // khanjar: handle, curved sheath
  c.beginPath(); c.moveTo(-9, -48); c.lineTo(9, -48); c.lineTo(6, -22); c.lineTo(-6, -22); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(0, -52, 13, 6, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(-9, -20); c.lineTo(9, -20); c.quadraticCurveTo(14, 18, 34, 34);
  c.quadraticCurveTo(38, 44, 28, 44); c.quadraticCurveTo(4, 30, -9, -20); c.fill();
  // belt
  c.fillRect(-46, -16, 92, 9);
  c.restore();
}
const flagCanvas = document.createElement('canvas');
flagCanvas.width = 1200; flagCanvas.height = 600;
(function paintFlag() {
  const c = flagCanvas.getContext('2d'), fw = 1200, fh = 600, band = fh * .42;
  c.fillStyle = WHITE; c.fillRect(0, 0, fw, fh / 3);
  c.fillStyle = RED; c.fillRect(0, fh / 3, fw, fh / 3);
  c.fillStyle = GREEN; c.fillRect(0, fh * 2 / 3, fw, fh / 3);
  c.fillStyle = RED; c.fillRect(0, 0, band, fh);
  c.save(); c.translate(band / 2, fh * .17); drawEmblem(c, fh * .26); c.restore();
})();

// waving flag: vertical slices with travelling sine + shading
function wavingFlag(x, y, w, h, t, amp = .06, opts = {}) {
  const slices = Math.ceil(w / 4), sw = w / slices;
  for (let i = 0; i < slices; i++) {
    const k = i / slices;
    const ph = k * 7 - t * (opts.speed || 6);
    const off = Math.sin(ph) * amp * h * (0.25 + k);
    const shade = Math.cos(ph) * (0.25 + k * .5);
    ctx.drawImage(flagCanvas, k * 1200, 0, 1200 / slices + 1, 600, x + i * sw, y + off, sw + 1, h);
    ctx.fillStyle = shade > 0 ? `rgba(255,255,255,${shade * .16})` : `rgba(0,0,0,${-shade * .28})`;
    ctx.fillRect(x + i * sw, y + off, sw + 1, h);
  }
}

function svgImg(s) { const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); return i; }
const bodyImg = svgImg(BODY), armImg = svgImg(ARM);

// x,y = feet position on canvas; s = px per svg unit
function zayana(x, y, s, t, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const bounce = Math.abs(Math.sin(t * Math.PI * 2)) * 10 * s / 2;   // hops on every beat
  ctx.translate(x - 200 * s, y - 584 * s - bounce);
  ctx.scale(s, s);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(200, 588 + bounce / s, 95 - bounce / s, 12, 0, 0, Math.PI * 2); ctx.fill();
  // arm behind? no: body first, then arm on top
  ctx.drawImage(bodyImg, 0, 0, 400, 620);
  // blink
  const bl = (t % 3.1);
  if (bl > 2.95) {
    ctx.fillStyle = '#f2c7a2';
    for (const ex of [178, 222]) { ctx.beginPath(); ctx.ellipse(ex, 176, 13, 15, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = '#1a0f0a'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    for (const ex of [178, 222]) { ctx.beginPath(); ctx.moveTo(ex - 12, 178); ctx.quadraticCurveTo(ex, 184, ex + 12, 178); ctx.stroke(); }
  }
  // waving arm + mini flag
  const ang = (-14 + Math.sin(t * Math.PI * 4) * 16) * Math.PI / 180;
  ctx.translate(250, 345); ctx.rotate(ang); ctx.translate(-250, -345);
  // pole
  ctx.strokeStyle = '#d9c08a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(272, 312); ctx.lineTo(290, 120); ctx.stroke();
  ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(290, 116, 6, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(290, 124); ctx.rotate(5 * Math.PI / 180);
  const fw = 120, fh = 64, sl = 40;
  for (let i = 0; i < sl; i++) {
    const k = i / sl, ph = k * 6 - t * 10, off = Math.sin(ph) * 6 * k;
    ctx.drawImage(flagCanvas, k * 1200, 0, 1200 / sl + 1, 600, i * fw / sl, off, fw / sl + .6, fh);
    const sh = Math.cos(ph) * k;
    ctx.fillStyle = sh > 0 ? `rgba(255,255,255,${sh * .15})` : `rgba(0,0,0,${-sh * .25})`;
    ctx.fillRect(i * fw / sl, off, fw / sl + .6, fh);
  }
  ctx.restore();
  ctx.drawImage(armImg, 0, 0, 400, 620);
  ctx.restore();
}

const OPEN = [1.6, 2.6];               // cover opens

// ---------- static textures ----------
const PW = 920, PH = 1320, PX = 80, PY = 300;      // album page in world coords; spine on the right
const paper = mkCanvas(PW, PH);
(function () {
  const c = paper.getContext('2d'), r = rng(42);
  const g = c.createRadialGradient(PW / 2, PH / 2, 200, PW / 2, PH / 2, PH * .75);
  g.addColorStop(0, '#f6ead0'); g.addColorStop(.7, '#ecdab4'); g.addColorStop(1, '#cfb27c');
  c.fillStyle = g; c.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 2600; i++) { c.fillStyle = `rgba(110,70,30,${r() * .08})`; c.fillRect(r() * PW, r() * PH, 1 + r() * 3, 1 + r() * 3); }
  for (let i = 0; i < 6; i++) {                                  // old stains
    const x = r() * PW, y = r() * PH, rr = 40 + r() * 90;
    const s = c.createRadialGradient(x, y, rr * .6, x, y, rr);
    s.addColorStop(0, 'rgba(160,110,50,0)'); s.addColorStop(.9, 'rgba(160,110,50,.07)'); s.addColorStop(1, 'rgba(160,110,50,0)');
    c.fillStyle = s; c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  // sadu weave bands (top & bottom)
  for (const y0 of [36, PH - 92]) {
    c.fillStyle = '#1d1210'; c.fillRect(30, y0, PW - 60, 56);
    for (let x = 30, k = 0; x < PW - 30; x += 28, k++) {
      c.fillStyle = k % 2 ? '#b3242c' : '#e9dcc0';
      c.beginPath(); c.moveTo(x, y0 + 12); c.lineTo(x + 14, y0 + 28); c.lineTo(x, y0 + 44); c.closePath(); c.fill();
      c.fillStyle = k % 3 === 0 ? '#1f8a4c' : '#d9a441';
      c.beginPath(); c.moveTo(x + 21, y0 + 22); c.lineTo(x + 26, y0 + 28); c.lineTo(x + 21, y0 + 34); c.lineTo(x + 16, y0 + 28); c.closePath(); c.fill();
    }
    c.fillStyle = '#e9dcc0'; c.fillRect(30, y0 + 4, PW - 60, 3); c.fillRect(30, y0 + 49, PW - 60, 3);
  }
})();

// ---------- small drawing helpers (draw on current ctx) ----------
function palm(x, y, s, sway) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -110, 4 + sway * 6, -220); ctx.stroke();
  ctx.translate(4 + sway * 6, -220);
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + (i - 4) * .38 + sway * .05, len = 110;
    ctx.strokeStyle = i % 2 ? '#2f7a3a' : '#3f9448'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(Math.cos(a) * len * .6, Math.sin(a) * len * .6 - 20, Math.cos(a) * len, Math.sin(a) * len + 40); ctx.stroke();
  }
  ctx.fillStyle = '#c9832e'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-10 + i * 5, 12 + (i % 2) * 6, 6, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function camel(x, y, s, ph, rider) {
  ctx.save(); ctx.translate(x, y); ctx.scale(-s, s);          // facing left
  ctx.fillStyle = '#3a1a12'; ctx.strokeStyle = '#3a1a12'; ctx.lineCap = 'round';
  ctx.lineWidth = 7;
  for (let i = 0; i < 4; i++) {
    const lx = [-30, -18, 26, 38][i], sw = Math.sin(ph + (i % 2 ? Math.PI : 0)) * 10;
    ctx.beginPath(); ctx.moveTo(lx, -10); ctx.lineTo(lx + sw, 52); ctx.stroke();
  }

  for (const d of DUST) { ctx.fillStyle = `rgba(255,220,160,${alpha * (.3 + .3 * Math.sin(t + d.p))})`; ctx.beginPath(); ctx.arc((d.x + Math.sin(t * .4 + d.p) * 30) % W, (d.y - t * d.v + H) % H, d.s, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
const EMBERS = (() => { const r = rng(23); return Array.from({ length: 90 }, () => ({ x: r() * W, d: r() * 4, v: 120 + r() * 220, s: 2 + r() * 4, w: r() * 6 })); })();
function embers(u) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of EMBERS) {
    const tt = u + e.d; const y = H + 40 - (tt * e.v) % (H + 80);
    ctx.fillStyle = `rgba(255,${190 + Math.sin(tt * 5 + e.w) * 40},90,${.5 + .4 * Math.sin(tt * 4 + e.w)})`;
    ctx.beginPath(); ctx.arc(e.x + Math.sin(tt * 1.5 + e.w) * 30, y, e.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------- world (table + album) ----------
function drawAlbum(t) {
  // leather back cover + page block under everything
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.filter = 'blur(18px)'; ctx.fillRect(PX - 10, PY + 30, PW + 50, PH + 30); ctx.filter = 'none';
  ctx.fillStyle = '#4a1014'; ctx.fillRect(PX - 22, PY - 20, PW + 44, PH + 40);
  ctx.fillStyle = '#e4d3ae'; for (let i = 0; i < 6; i++) ctx.fillRect(PX - 12 + i * 2, PY - 8 + i * 2, PW + 8, PH + 12);
  // spine
  ctx.fillStyle = '#3a0b0f'; ctx.fillRect(PX + PW, PY - 20, 24, PH + 40);

  const open = prog(t, OPEN[0], OPEN[1]);
  // which page is on top, and which one is turning
  let top = NG, turning = -1, f = 0;
  for (let i = 0; i < NG; i++) {
    const fs = START[i + 1] - FLIP;
    if (t < fs) { top = i; break; }
    if (t < fs + FLIP) { top = i + 1; turning = i; f = easeInOut((t - fs) / FLIP); break; }
  }
  ctx.drawImage(renderPage(pageCvs[0], top, t), PX, PY);
  if (turning >= 0) {
    turnShadow(f);
    drawTurning(renderPage(pageCvs[1], turning, t), f, '#e8d6b0');
  }
  if (open < 1) {
    const c = coverFull.getContext('2d'); c.drawImage(cover, 0, 0);
    withCtx(c, () => { ctx.save(); ctx.translate(-PX, -PY); drawCoverText(1); ctx.restore(); });
    if (open > 0) turnShadow(easeInOut(open));
    drawTurning(coverFull, easeInOut(open), '#5a1418');
  }
}
function drawWorld(t) {
  ctx.drawImage(wood, 0, 0);
  drawAlbum(t);
  // props visible in the intro
  if (t < 3.2) {
    mabkhara(170, 1830, .9);
    zayana(880, 1900, .85, t, clamp(1 - prog(t, 2.2, 3.0)));
  }
}

// ---------- finale (full frame) ----------
function finale(u, t) {
  const g = ctx.createRadialGradient(W / 2, 760, 60, W / 2, 900, 1300);
  g.addColorStop(0, '#f6c75a'); g.addColorStop(.35, '#c4202b'); g.addColorStop(1, '#3a0408');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 760); ctx.rotate(t * .08);
  for (let i = 0; i < 24; i++) { ctx.rotate(Math.PI / 12); ctx.fillStyle = 'rgba(255,230,160,.08)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -2200); ctx.lineTo(90, -2200); ctx.fill(); }
  ctx.restore();
  embers(u);
  const fk = easeOut(prog(u, 0, .8));
  ctx.save(); ctx.translate(W / 2, 850); ctx.scale(lerp(.85, 1, fk), lerp(.85, 1, fk));
  ctx.fillStyle = GOLD; ctx.fillRect(-470, -250, 14, 1000);
  ctx.beginPath(); ctx.arc(-463, -258, 16, 0, Math.PI * 2); ctx.fill();
  wavingFlag(-456, -230, 900, 450, t, .06, { speed: 3.5 });
  ctx.restore();
  smoke(150, H + 40, t, .6, 1600); smoke(960, H + 40, t + 3, .5, 1500);
  const p1 = easeOut(prog(u, .3, 1.1)), p2 = easeOut(prog(u, .7, 1.5));
  text('كل عام', W / 2, 300, { size: 130, alpha: p1, scale: lerp(1.15, 1, p1), fill: WHITE, stroke: '#3a0408', strokeW: 16, glow: 'rgba(0,0,0,.4)' });
  text('وعُمان بخير', W / 2, 450, { size: 170, alpha: p2, scale: lerp(1.15, 1, p2), fill: 'gold', stroke: '#3a0408', strokeW: 20, glow: 'rgba(255,200,90,.5)', glowBlur: 40 });
  text('١١ محافظة · ٦٣ ولاية · قلب واحد', W / 2, 565, { size: 44, font: 'Cairo', weight: 900, alpha: easeOut(prog(u, 1.1, 1.7)), fill: '#fff1d6' });
  const pk = easeOut(prog(u, 1.4, 2.0));
  ctx.save(); ctx.globalAlpha = pk; ctx.translate(W / 2, 1150);
  ctx.fillStyle = 'rgba(40,6,10,.85)'; ctx.beginPath(); ctx.roundRect(-310, -48, 620, 96, 48); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
  text('اليوم الوطني · ٢٠ نوفمبر', W / 2, 1152, { size: 50, font: 'Cairo', weight: 900, alpha: pk, fill: '#ffe7b0' });
  const zk = easeBack(prog(u, .9, 1.6));
  zayana(W / 2, lerp(H + 700, 1860, zk), 1.15, t);
  text('من ألبوم زيانه.. بكل حب', W / 2, 1255, { size: 46, font: 'Reem', weight: 700, alpha: easeOut(prog(u, 2.2, 2.8)), fill: '#fff1d6' });
}

// ---------- master render ----------
function render(t) {
  ctx_t = t; ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  if (t < FINALE + .45) {
    // camera: intro pull-in, gentle drift, then dive into the last photo
    let s = lerp(.8, 1, easeInOut(prog(t, 0, 2.8))) * (1 + .02 * Math.sin(t * .6));
    let cx = W / 2, cy = 960;
    const z = easeInOut(prog(t, ZOOM[0], ZOOM[1]));
    if (z > 0) { s = lerp(s, 1080 / PS * 1.02, z); cy = lerp(960, PY + 640 - 420 + 30 + PS / 2, z); }
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-cx, -cy);
    drawWorld(t);
    ctx.restore();
    // warm lamp light + frankincense smoke + dust
    const lg = ctx.createRadialGradient(200, 200, 50, 300, 400, 1500);
    lg.addColorStop(0, 'rgba(255,200,120,.25)'); lg.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    smoke(170 + (1 - clamp(t / 2.8)) * 0, 1680, t, clamp(1 - prog(t, 3, 5)) * .9 + .25, 1500);
    dust(t, 1);
  }
  if (t >= FINALE) {
    ctx.save(); ctx.globalAlpha = easeInOut(prog(t, FINALE, FINALE + .45));
    finale(t - FINALE, t);
    ctx.restore();
    // golden flash on the cut
    const fl = Math.exp(-(t - FINALE - .25) * 6) * (t > FINALE + .25 ? 1 : prog(t, FINALE, FINALE + .25));
    ctx.fillStyle = `rgba(255,236,190,${clamp(fl) * .55})`; ctx.fillRect(0, 0, W, H);
  }
  // vignette + fade in/out
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - prog(t, 0, .5), prog(t, DURATION - .6, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  await Promise.all([
    document.fonts.load('100px "Lalezar"'), document.fonts.load('900 100px "Cairo"'), document.fonts.load('700 100px "Reem"'),
    bodyImg.decode(), armImg.decode(),
  ]);
  return true;
})();
window.render = render;
window.META = { W, H, DURATION, FPS };
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script>
