<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Zayana Grandma Album</title>
<style>
  @font-face { font-family: "Lalezar"; src: url("fonts/Lalezar.ttf"); }
  @font-face { font-family: "Cairo"; font-weight: 900; src: url("fonts/Cairo-Black.ttf"); }
  @font-face { font-family: "Reem"; font-weight: 700; src: url("fonts/ReemKufi-Bold.ttf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  ألبوم الجدّة — زيانه تقلّب ألبوم عُمان القديم
//  1080x1920, 21s. render(t) is a pure function of t.
//  NOTE: album.html is generated from album.src.html by build_album.py
//        (it inlines the shared helpers from reel.html).
// ============================================================
const W = 1080, H = 1920, DURATION = 21, FPS = 30;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/*SHARED*/

// ---------- timeline ----------
const OPEN = [1.6, 2.6];               // cover opens
const T0 = 2.6, P = 2.5, NPLACES = 5;  // five place pages, 2.5s each
const FINAL_T = T0 + NPLACES * P;      // 15.1 — final (flag) page on top
const ZOOM = [16.2, 17.3];             // dive into the last photo
const FINALE = 17.1;                   // full-frame finale
const FLIP = .6;
const pageStart = i => i < NPLACES ? T0 + i * P : FINAL_T;
const flipProg = i => i < NPLACES ? prog(ctx_t, T0 + (i + 1) * P - FLIP, T0 + (i + 1) * P) : 0;
let ctx_t = 0;

// ---------- static textures ----------
const PW = 920, PH = 1320, PX = 80, PY = 300;      // album page in world coords; spine on the right
const paper = mkCanvas(PW, PH);
(function () {
  const c = paper.getContext('2d'), r = rng(42);
  const g = c.createRadialGradient(PW / 2, PH / 2, 200, PW / 2, PH / 2, PH * .75);
  g.addColorStop(0, '#f6ead0'); g.addColorStop(.7, '#ecdab4'); g.addColorStop(1, '#cfb27c');
  c.fillStyle = g; c.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 2600; i++) { c.fillStyle = `rgba(110,70,30,${r() * .08})`; c.fillRect(r() * PW, r() * PH, 1 + r() * 3, 1 + r() * 3); }
  for (let i = 0; i < 6; i++) {                                  // old stains
    const x = r() * PW, y = r() * PH, rr = 40 + r() * 90;
    const s = c.createRadialGradient(x, y, rr * .6, x, y, rr);
    s.addColorStop(0, 'rgba(160,110,50,0)'); s.addColorStop(.9, 'rgba(160,110,50,.07)'); s.addColorStop(1, 'rgba(160,110,50,0)');
    c.fillStyle = s; c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  // sadu weave bands (top & bottom)
  for (const y0 of [36, PH - 92]) {
    c.fillStyle = '#1d1210'; c.fillRect(30, y0, PW - 60, 56);
    for (let x = 30, k = 0; x < PW - 30; x += 28, k++) {
      c.fillStyle = k % 2 ? '#b3242c' : '#e9dcc0';
      c.beginPath(); c.moveTo(x, y0 + 12); c.lineTo(x + 14, y0 + 28); c.lineTo(x, y0 + 44); c.closePath(); c.fill();
      c.fillStyle = k % 3 === 0 ? '#1f8a4c' : '#d9a441';
      c.beginPath(); c.moveTo(x + 21, y0 + 22); c.lineTo(x + 26, y0 + 28); c.lineTo(x + 21, y0 + 34); c.lineTo(x + 16, y0 + 28); c.closePath(); c.fill();
    }
    c.fillStyle = '#e9dcc0'; c.fillRect(30, y0 + 4, PW - 60, 3); c.fillRect(30, y0 + 49, PW - 60, 3);
  }
})();
const wood = mkCanvas(W, H);
(function () {
  const c = wood.getContext('2d'), r = rng(8);
  const g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#5a3520'); g.addColorStop(1, '#2e1a0f');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) {
    const y = r() * H; c.strokeStyle = `rgba(${r() > .5 ? '20,10,5' : '120,75,40'},${.15 + r() * .2})`; c.lineWidth = 1 + r() * 4;
    c.beginPath(); for (let x = 0; x <= W; x += 40) { const yy = y + Math.sin(x / (80 + i) + i) * 10; x ? c.lineTo(x, yy) : c.moveTo(x, yy); } c.stroke();
  }
})();
const goldEmblem = mkCanvas(260, 260);
(function () {
  const c = goldEmblem.getContext('2d');
  c.translate(130, 140); drawEmblem(c, 220); c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-in';
  const g = c.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, '#fff0b8'); g.addColorStop(.5, '#e2b24a'); g.addColorStop(1, '#a8741c');
  c.fillStyle = g; c.fillRect(0, 0, 260, 260);
})();

// ---------- small drawing helpers (draw on current ctx) ----------
function palm(x, y, s, sway) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -110, 4 + sway * 6, -220); ctx.stroke();
  ctx.translate(4 + sway * 6, -220);
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + (i - 4) * .38 + sway * .05, len = 110;
    ctx.strokeStyle = i % 2 ? '#2f7a3a' : '#3f9448'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(Math.cos(a) * len * .6, Math.sin(a) * len * .6 - 20, Math.cos(a) * len, Math.sin(a) * len + 40); ctx.stroke();
  }
  ctx.fillStyle = '#c9832e'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-10 + i * 5, 12 + (i % 2) * 6, 6, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function camel(x, y, s, ph, rider) {
  ctx.save(); ctx.translate(x, y); ctx.scale(-s, s);          // facing left
  ctx.fillStyle = '#3a1a12'; ctx.strokeStyle = '#3a1a12'; ctx.lineCap = 'round';
  ctx.lineWidth = 7;
  for (let i = 0; i < 4; i++) {
    const lx = [-30, -18, 26, 38][i], sw = Math.sin(ph + (i % 2 ? Math.PI : 0)) * 10;
    ctx.beginPath(); ctx.moveTo(lx, -10); ctx.lineTo(lx + sw, 52); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(4, -22, 50, 24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2, -46, 22, 18, 0, 0, Math.PI * 2); ctx.fill();   // hump
  ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(48, -26); ctx.quadraticCurveTo(70, -40, 66, -70); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(76, -74, 16, 9, .2, 0, Math.PI * 2); ctx.fill();
  if (rider) { ctx.beginPath(); ctx.moveTo(-14, -60); ctx.lineTo(10, -60); ctx.lineTo(4, -100); ctx.lineTo(-8, -100); ctx.fill(); ctx.beginPath(); ctx.arc(-2, -110, 10, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function gulls(u, x0, y0, n, col = 'rgba(40,40,50,.8)') {
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = x0 + u * 40 + i * 50, y = y0 + (i % 2) * 26, f = Math.sin(u * 10 + i) * 8;
    ctx.beginPath(); ctx.moveTo(x - 16, y - f); ctx.quadraticCurveTo(x - 6, y - 6, x, y); ctx.quadraticCurveTo(x + 6, y - 6, x + 16, y - f); ctx.stroke();
  }
}
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }

// ---------- the photos (740x740, full colour) ----------
const PS = 740;
const PHOTOS = [
  { title: 'مطرح', sub: 'ميناء الحكايات والبحّارة', rot: -2.5, draw(u) {
    ctx.fillStyle = vgrad(0, 400, ['#5aa7d8', '#a9d3ea', '#f6dcae']); ctx.fillRect(0, 0, PS, PS);
    ctx.fillStyle = '#7a5a48'; ctx.beginPath(); ctx.moveTo(0, 420);
    [[0, 250], [80, 190], [150, 230], [230, 150], [330, 240], [420, 200], [520, 260], [620, 210], [740, 280], [740, 420]].forEach(p => ctx.lineTo(...p)); ctx.fill();
    // watchtower on the ridge
    ctx.fillStyle = '#d9b48a'; ctx.fillRect(208, 112, 46, 50); for (let i = 0; i < 4; i++) ctx.fillRect(208 + i * 13, 102, 8, 12);
    // corniche houses
    const r = rng(3);
    for (let x = -10; x < PS; ) {
      const w = 50 + r() * 50, h = 50 + r() * 50;
      ctx.fillStyle = r() > .3 ? '#f4efe4' : '#e8d7b9'; ctx.fillRect(x, 430 - h, w, h + 12);
      ctx.fillStyle = '#5b7f8f'; for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.moveTo(x + 10 + k * 22, 430 - h + 40); ctx.lineTo(x + 10 + k * 22, 430 - h + 22); ctx.arc(x + 17 + k * 22, 430 - h + 22, 7, Math.PI, 0); ctx.lineTo(x + 24 + k * 22, 430 - h + 40); ctx.fill(); }
      if (r() > .6) { ctx.fillStyle = '#f4efe4'; ctx.fillRect(x + w / 2 - 6, 430 - h - 50, 12, 50); ctx.beginPath(); ctx.arc(x + w / 2, 430 - h - 50, 9, Math.PI, 0); ctx.fill(); }
      x += w + 2;
    }
    ctx.fillStyle = vgrad(440, PS, ['#2f8fb0', '#13506e']); ctx.fillRect(0, 440, PS, PS);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 40; i++) { const y = 450 + ((i * 37) % 290), x = ((i * 97 + u * 30) % (PS + 80)) - 40; ctx.fillRect(x, y, 30 + (y - 440) * .2, 3); }
    // dhow
    ctx.save(); ctx.translate(380 + u * 12, 590 + Math.sin(u * 2.4) * 5); ctx.rotate(Math.sin(u * 2) * .03);
    ctx.fillStyle = '#5b3018'; ctx.beginPath(); ctx.moveTo(-150, -8); ctx.quadraticCurveTo(-50, 38, 110, 26); ctx.lineTo(175, -40); ctx.lineTo(130, -16); ctx.lineTo(-130, -20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e3b341'; ctx.fillRect(-130, -24, 260, 6);
    ctx.strokeStyle = '#3d220f'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(0, -280); ctx.stroke();
    ctx.fillStyle = '#fbefd8'; ctx.beginPath(); ctx.moveTo(-160, -130); ctx.lineTo(110, -300); ctx.quadraticCurveTo(86, -140, 36, -36); ctx.closePath(); ctx.fill();
    wavingFlag(0, -316, 60, 30, u * 1.5, .1);
    ctx.restore();
    gulls(u, 420, 120, 3);
  } },
  { title: 'نزوى', sub: 'قلعة شامخة من زمان', rot: 2, draw(u) {
    ctx.fillStyle = vgrad(0, 480, ['#4f9fd6', '#bfe0f0', '#eef4ee']); ctx.fillRect(0, 0, PS, PS);
    ctx.fillStyle = '#b8a294'; ctx.beginPath(); ctx.moveTo(0, 470);
    [[0, 330], [120, 260], [210, 300], [330, 220], [460, 290], [560, 240], [740, 320], [740, 470]].forEach(p => ctx.lineTo(...p)); ctx.fill();
    // side walls
    ctx.fillStyle = '#c4935f'; ctx.fillRect(40, 400, 660, 130);
    for (let x = 40; x < 700; x += 26) ctx.fillRect(x, 388, 14, 14);
    // the great round tower
    const tg = ctx.createLinearGradient(220, 0, 520, 0);
    tg.addColorStop(0, '#9c6f45'); tg.addColorStop(.35, '#e3b783'); tg.addColorStop(1, '#8a5f3a');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(220, 540); ctx.lineTo(236, 190); ctx.lineTo(504, 190); ctx.lineTo(520, 540); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(370, 190, 134, 22, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 12; i++) { const a = Math.PI * (i / 11); const x = 370 - Math.cos(a) * 128; ctx.fillRect(x - 8, 160 + Math.sin(a) * 18, 16, 24); }
    ctx.fillStyle = 'rgba(70,40,20,.6)';
    for (const [x, y] of [[300, 260], [370, 255], [440, 260], [330, 360], [410, 360]]) { ctx.fillRect(x - 7, y, 14, 26); }
    ctx.strokeStyle = '#3d220f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(370, 170); ctx.lineTo(370, 70); ctx.stroke();
    wavingFlag(370, 70, 80, 40, u * 1.3, .1);
    // ground + falaj + palms
    ctx.fillStyle = '#d9b98a'; ctx.fillRect(0, 530, PS, 210);
    ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(-10, 700); ctx.quadraticCurveTo(360, 600, 750, 660); ctx.stroke();
    ctx.strokeStyle = '#4ba3c4'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-10, 700); ctx.quadraticCurveTo(360, 600, 750, 660); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.setLineDash([14, 22]); ctx.lineDashOffset = -u * 60;
    ctx.beginPath(); ctx.moveTo(-10, 700); ctx.quadraticCurveTo(360, 600, 750, 660); ctx.stroke(); ctx.setLineDash([]);
    palm(90, 640, 1.2, Math.sin(u * 1.5)); palm(650, 620, 1.05, Math.sin(u * 1.5 + 1)); palm(170, 600, .8, Math.sin(u * 1.5 + 2));
  } },
  { title: 'الجبل الأخضر', sub: 'ورد ومدرّجات وماي', rot: -1.5, draw(u) {
    ctx.fillStyle = vgrad(0, 300, ['#f7c6a0', '#fbe3c4', '#d7e7ef']); ctx.fillRect(0, 0, PS, PS);
    ctx.fillStyle = '#a8908f'; ctx.beginPath(); ctx.moveTo(0, 320);
    [[0, 180], [140, 110], [260, 170], [380, 80], [520, 160], [640, 120], [740, 170], [740, 320]].forEach(p => ctx.lineTo(...p)); ctx.fill();
    // terraces
    for (let i = 0; i < 9; i++) {
      const y = 260 + i * 56;
      ctx.fillStyle = i % 2 ? '#4f9a4a' : '#62ad55';
      ctx.beginPath(); ctx.moveTo(0, y + 30);
      for (let x = 0; x <= PS; x += 20) ctx.lineTo(x, y + Math.sin(x / 140 + i * .8) * 22);
      ctx.lineTo(PS, PS); ctx.lineTo(0, PS); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#8c7a62'; ctx.lineWidth = 7; ctx.beginPath();
      for (let x = 0; x <= PS; x += 20) { const yy = y + Math.sin(x / 140 + i * .8) * 22; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
      const r = rng(i + 50);
      for (let k = 0; k < 9; k++) {               // rose bushes
        const x = r() * PS, yy = y + 22 + Math.sin(x / 140 + i * .8) * 22;
        ctx.fillStyle = '#2f6e33'; ctx.beginPath(); ctx.arc(x, yy, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = ['#e85a8f', '#f28bb0', '#d93f74'][k % 3];
        for (let p = 0; p < 4; p++) { ctx.beginPath(); ctx.arc(x - 8 + p * 5, yy - 6 + (p % 2) * 8, 4.5, 0, Math.PI * 2); ctx.fill(); }
      }
    }
    // stone village
    const r = rng(9);
    for (let i = 0; i < 9; i++) {
      const x = 470 + i * 28 + r() * 10, y = 190 + (i % 3) * 22 + r() * 10, w = 40 + r() * 20, h = 32 + r() * 18;
      ctx.fillStyle = '#c2a789'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#5a4030'; ctx.fillRect(x + 8, y + 10, 7, 10); ctx.fillRect(x + w - 16, y + 10, 7, 10);
    }
    // drifting petals
    for (let i = 0; i < 14; i++) {
      const x = (i * 83 + u * 50) % PS, y = (i * 131 + u * 40) % PS;
      ctx.fillStyle = 'rgba(240,110,150,.9)'; ctx.beginPath(); ctx.ellipse(x, y, 7, 4, u + i, 0, Math.PI * 2); ctx.fill();
    }
  } },
  { title: 'رمال الشرقية', sub: 'ذهب الغروب', rot: 2.5, draw(u) {
    ctx.fillStyle = vgrad(0, 460, ['#5b2a63', '#e8633f', '#ffd27a']); ctx.fillRect(0, 0, PS, PS);
    const sy = 360 + u * 6;
    const sg = ctx.createRadialGradient(370, sy, 0, 370, sy, 260); sg.addColorStop(0, 'rgba(255,240,190,1)'); sg.addColorStop(.35, 'rgba(255,190,100,.6)'); sg.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 100, PS, 520);
    ctx.fillStyle = '#fff1c4'; ctx.beginPath(); ctx.arc(370, sy, 90, 0, Math.PI * 2); ctx.fill();
    const dune = (y, a, f, ph, col) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, PS);
      for (let x = 0; x <= PS; x += 10) ctx.lineTo(x, y + Math.sin(x / f + ph) * a + Math.sin(x / (f * .37) + ph * 2) * a * .25);
      ctx.lineTo(PS, PS); ctx.closePath(); ctx.fill();
    };
    dune(430, 30, 120, 1, '#e7934f'); dune(490, 36, 150, 3, '#d5743a');
    // caravan on the ridge
    for (let i = 0; i < 4; i++) camel(560 - i * 120 - u * 18, 470 - i * 4, .62, u * 7 + i, i === 0);
    dune(570, 40, 170, 5, '#bb5a2c'); dune(660, 30, 130, 2, '#9e4624');
    ctx.strokeStyle = 'rgba(255,220,160,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); for (let x = 0; x <= PS; x += 10) { const y = 570 + Math.sin(x / 170 + 5) * 40 + Math.sin(x / 63 + 10) * 10; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  } },
  { title: 'صلالة', sub: 'خريف ولبان', rot: -2, draw(u) {
    ctx.fillStyle = vgrad(0, 400, ['#c9d9d6', '#e6efe9', '#f2f5ef']); ctx.fillRect(0, 0, PS, PS);
    const hill = (y, a, f, ph, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, PS); for (let x = 0; x <= PS; x += 10) ctx.lineTo(x, y + Math.sin(x / f + ph) * a); ctx.lineTo(PS, PS); ctx.closePath(); ctx.fill(); };
    hill(250, 40, 130, 1, '#9cc59a');
    // waterfall cliff
    ctx.fillStyle = '#6f8b6a'; ctx.beginPath(); ctx.moveTo(420, 230); ctx.lineTo(740, 200); ctx.lineTo(740, 520); ctx.lineTo(420, 520); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4f9a50'; ctx.fillRect(420, 222, 320, 24);
    for (let i = 0; i < 9; i++) {
      const x = 520 + i * 14, off = (u * 260 + i * 37) % 60;
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(x, 240, 9, 270);
      ctx.fillStyle = 'rgba(200,230,240,.9)'; for (let y = 240 - 60 + off; y < 510; y += 60) ctx.fillRect(x, y, 9, 22);
    }
    ctx.fillStyle = '#7fc4c9'; ctx.beginPath(); ctx.ellipse(590, 520, 170, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(586, 512, 80 + Math.sin(u * 6) * 6, 14, 0, 0, Math.PI * 2); ctx.fill();
    hill(470, 30, 110, 3, '#5aa85a'); hill(600, 26, 90, 4, '#3f8f45');
    // mist
    for (let i = 0; i < 4; i++) {
      const g = ctx.createLinearGradient(0, 0, PS, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.save(); ctx.translate(((u * 30 + i * 220) % 1100) - 400, 280 + i * 90); ctx.fillRect(0, 0, 700, 50); ctx.restore();
    }
    // frankincense tree
    ctx.save(); ctx.translate(150, 720);
    ctx.strokeStyle = '#8d8070'; ctx.lineCap = 'round';
    const br = (x, y, a, l, w, d) => { if (d === 0) { ctx.fillStyle = '#3e7d3a'; for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.ellipse(x + Math.cos(k) * 14, y + Math.sin(k * 2) * 10, 11, 6, k, 0, Math.PI * 2); ctx.fill(); } return; }
      const x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo((x + x2) / 2 + 12, (y + y2) / 2, x2, y2); ctx.stroke();
      br(x2, y2, a - .5 + Math.sin(u + d) * .03, l * .72, w * .65, d - 1); br(x2, y2, a + .45, l * .7, w * .65, d - 1); };
    br(0, 0, -Math.PI / 2 - .15, 150, 26, 4);
    ctx.restore();
    // drizzle
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 50; i++) { const x = (i * 71) % PS, y = (i * 113 + u * 500) % PS; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 18); ctx.stroke(); }
  } },
  { title: 'عُمان', sub: 'أمس.. واليوم.. وبكرة', rot: 0, draw(u, t) {
    const g = ctx.createRadialGradient(370, 300, 40, 370, 360, 520); g.addColorStop(0, '#f6c75a'); g.addColorStop(.5, '#c4202b'); g.addColorStop(1, '#5a0710');
    ctx.fillStyle = g; ctx.fillRect(0, 0, PS, PS);
    ctx.save(); ctx.translate(370, 330); ctx.rotate(t * .15);
    for (let i = 0; i < 18; i++) { ctx.rotate(Math.PI / 9); ctx.fillStyle = 'rgba(255,230,160,.12)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-50, -700); ctx.lineTo(50, -700); ctx.fill(); }
    ctx.restore();
    wavingFlag(70, 70, 600, 300, t, .07);
    zayana(370, 728, .66, t);
  } },
];

// ---------- photo + page compositing ----------
const photoCv = mkCanvas(PS, PS), photoCtx = photoCv.getContext('2d');
const pageCvs = [mkCanvas(PW, PH), mkCanvas(PW, PH)];
function colorK(i, t) { const v = t - pageStart(i); return i < NPLACES ? easeInOut(prog(v, .45, 1.25)) : easeInOut(prog(v, .25, .9)); }
function capK(i, t) { const v = t - pageStart(i); return i < NPLACES ? easeOut(prog(v, .75, 1.45)) : easeOut(prog(v, .45, 1.1)); }
function renderPhoto(i, t) {
  const u = t - pageStart(i) + 1;
  withCtx(photoCtx, () => { ctx.save(); ctx.clearRect(0, 0, PS, PS); PHOTOS[i].draw(u, t); ctx.restore(); });
}
function drawPhotoOnto(c, i, t) {         // c = page ctx; photo centred at (PW/2, 640)
  renderPhoto(i, t);
  const k = colorK(i, t), ph = PHOTOS[i];
  c.save(); c.translate(PW / 2, 640); c.rotate(ph.rot * Math.PI / 180);
  // polaroid frame + shadow
  c.shadowColor = 'rgba(60,30,10,.45)'; c.shadowBlur = 30; c.shadowOffsetY = 14;
  c.fillStyle = '#fbf7ee'; c.fillRect(-400, -420, 800, 880);
  c.shadowColor = 'transparent';
  c.translate(-PS / 2, -420 + 30);
  c.filter = 'sepia(1) contrast(1.08) brightness(.93)';
  c.drawImage(photoCv, 0, 0);
  c.filter = 'none';
  if (k > 0) { c.globalAlpha = k; c.drawImage(photoCv, 0, 0); c.globalAlpha = 1; }
  // old-photo wear: grain, scratches, vignette (fades as it comes to life)
  const old = 1 - k;
  if (old > 0) {
    const r = rng(i * 7 + Math.floor(t * 12));
    c.globalAlpha = old * .5;
    c.strokeStyle = 'rgba(255,250,235,.7)'; c.lineWidth = 1.5;
    for (let s = 0; s < 5; s++) { const x = r() * PS; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + (r() - .5) * 30, PS); c.stroke(); }
    c.fillStyle = 'rgba(40,25,10,.5)'; for (let s = 0; s < 220; s++) c.fillRect(r() * PS, r() * PS, 2, 2);
    c.globalAlpha = 1;
  }
  const vg = c.createRadialGradient(PS / 2, PS / 2, PS * .3, PS / 2, PS / 2, PS * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(40,20,5,${.15 + old * .35})`);
  c.fillStyle = vg; c.fillRect(0, 0, PS, PS);
  // developing shine sweep
  if (k > 0 && k < 1) {
    const x = lerp(-300, PS + 300, k);
    const sg = c.createLinearGradient(x - 160, 0, x + 160, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,248,220,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.save(); c.beginPath(); c.rect(0, 0, PS, PS); c.clip(); c.translate(x, PS / 2); c.rotate(.35); c.translate(-x, -PS / 2);
    c.fillStyle = sg; c.fillRect(x - 160, -400, 320, PS + 800); c.restore();
  }
  c.restore();
  // tape
  for (const [x, y, a] of [[PW / 2 - 330, 230, -.6], [PW / 2 + 330, 230, .6]]) {
    c.save(); c.translate(x, y); c.rotate(a); c.fillStyle = 'rgba(236,224,190,.78)'; c.fillRect(-70, -22, 140, 44);
    c.strokeStyle = 'rgba(180,160,120,.4)'; c.setLineDash([4, 4]); c.strokeRect(-70, -22, 140, 44); c.setLineDash([]); c.restore();
  }
}
function renderPage(cvs, i, t) {
  const c = cvs.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
  c.drawImage(paper, 0, 0);
  drawPhotoOnto(c, i, t);
  const ck = capK(i, t);
  withCtx(c, () => {
    text(PHOTOS[i].title, PW / 2, 1120, { size: 96, font: 'Reem', weight: 700, fill: '#4a2c1a', reveal: ck });
    text(PHOTOS[i].sub, PW / 2, 1210, { size: 46, font: 'Cairo', weight: 900, fill: '#8a5a32', alpha: easeOut(prog(ck, .5, 1)) });
  });
  return cvs;
}

// draw a page (or the cover) turning around the spine at world x = PX+PW
function drawTurning(img, f, backFill) {
  const ang = f * Math.PI, sx = Math.cos(ang), lift = Math.sin(ang);
  ctx.save();
  ctx.translate(PX + PW, PY + PH / 2);
  ctx.scale(sx, 1 + lift * .05);
  if (sx > 0) {
    ctx.drawImage(img, -PW, -PH / 2);
    ctx.fillStyle = `rgba(0,0,0,${lift * .45})`; ctx.fillRect(-PW, -PH / 2, PW, PH);
  } else {
    ctx.fillStyle = backFill; ctx.fillRect(-PW, -PH / 2, PW, PH);
    ctx.fillStyle = `rgba(255,255,255,${(1 - lift) * .1})`; ctx.fillRect(-PW, -PH / 2, PW, PH);
  }
  ctx.restore();
}
function turnShadow(f) {     // shadow cast onto the page underneath
  const edge = PX + PW - PW * Math.cos(f * Math.PI);
  if (f >= .5) return;
  const g = ctx.createLinearGradient(edge - 160, 0, edge, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.35 * Math.sin(f * Math.PI)})`);
  ctx.fillStyle = g; ctx.fillRect(Math.max(PX, edge - 160), PY, Math.min(160, edge - PX), PH);
}

// ---------- cover ----------
const cover = mkCanvas(PW, PH);
(function () {
  const c = cover.getContext('2d');
  const g = c.createLinearGradient(0, 0, PW, PH); g.addColorStop(0, '#7a1c22'); g.addColorStop(1, '#3f0c10');
  c.fillStyle = g; c.fillRect(0, 0, PW, PH);
  const r = rng(5); for (let i = 0; i < 3000; i++) { c.fillStyle = `rgba(0,0,0,${r() * .12})`; c.fillRect(r() * PW, r() * PH, 2, 2); }
  c.strokeStyle = '#d9a845'; c.lineWidth = 6; c.strokeRect(46, 46, PW - 92, PH - 92);
  c.lineWidth = 2; c.strokeRect(62, 62, PW - 124, PH - 124);
  for (const [x, y] of [[62, 62], [PW - 62, 62], [62, PH - 62], [PW - 62, PH - 62]]) {
    c.save(); c.translate(x, y); c.rotate(Math.PI / 4); c.fillStyle = '#d9a845'; c.fillRect(-16, -16, 32, 32); c.restore();
  }
  c.drawImage(goldEmblem, PW / 2 - 130, 230);
})();
function drawCoverText(alpha) {
  // drawn live so fonts are guaranteed loaded
  text('عُمان', PX + PW / 2, PY + 720, { size: 230, fill: 'gold', alpha, glow: 'rgba(0,0,0,.4)', glowBlur: 20 });
  text('ألبوم الذكريات', PX + PW / 2, PY + 920, { size: 84, font: 'Reem', weight: 700, fill: 'gold', alpha });
  text('٢٠ نوفمبر', PX + PW / 2, PY + 1080, { size: 54, font: 'Cairo', weight: 900, fill: '#e8c27a', alpha: alpha * .9 });
}
const coverFull = mkCanvas(PW, PH);

// ---------- table props ----------
function mabkhara(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 6, 90, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8653a'; ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(70, 0); ctx.lineTo(54, -110); ctx.lineTo(-54, -110); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c4202b'; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 18 - 8, -20); ctx.lineTo(i * 18 + 8, -20); ctx.lineTo(i * 18, -44); ctx.fill(); }
  ctx.fillStyle = '#1f8a4c'; ctx.fillRect(-60, -70, 120, 8);
  ctx.fillStyle = '#d17a48'; ctx.beginPath(); ctx.moveTo(-80, -110); ctx.lineTo(80, -110); ctx.lineTo(64, -170); ctx.lineTo(-64, -170); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1408'; ctx.beginPath(); ctx.ellipse(0, -170, 64, 12, 0, 0, Math.PI * 2); ctx.fill();
  const t = ctx_t; ctx.fillStyle = `rgba(255,${120 + Math.sin(t * 9) * 30},40,.9)`; ctx.beginPath(); ctx.ellipse(0, -172, 30, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function smoke(x, y, t, alpha, height = 1100) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.filter = 'blur(10px)'; ctx.lineCap = 'round';
  for (let k = 0; k < 5; k++) {
    ctx.strokeStyle = `rgba(245,240,230,${.16 - k * .02})`; ctx.lineWidth = 26 - k * 3;
    ctx.beginPath();
    for (let d = 0; d <= height; d += 20) {
      const xx = x + Math.sin(d * .012 - t * 1.6 + k * 1.3) * (8 + d * .09) + Math.sin(d * .004 + t * .5 + k) * d * .05;
      d ? ctx.lineTo(xx, y - d) : ctx.moveTo(xx, y - d);
    }
    ctx.stroke();
  }
  ctx.filter = 'none'; ctx.restore();
}
const DUST = (() => { const r = rng(17); return Array.from({ length: 60 }, () => ({ x: r() * W, y: r() * H, s: 1 + r() * 3, p: r() * 6, v: 8 + r() * 20 })); })();
function dust(t, alpha) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const d of DUST) { ctx.fillStyle = `rgba(255,220,160,${alpha * (.3 + .3 * Math.sin(t + d.p))})`; ctx.beginPath(); ctx.arc((d.x + Math.sin(t * .4 + d.p) * 30) % W, (d.y - t * d.v + H) % H, d.s, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
const EMBERS = (() => { const r = rng(23); return Array.from({ length: 90 }, () => ({ x: r() * W, d: r() * 4, v: 120 + r() * 220, s: 2 + r() * 4, w: r() * 6 })); })();
function embers(u) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of EMBERS) {
    const tt = u + e.d; const y = H + 40 - (tt * e.v) % (H + 80);
    ctx.fillStyle = `rgba(255,${190 + Math.sin(tt * 5 + e.w) * 40},90,${.5 + .4 * Math.sin(tt * 4 + e.w)})`;
    ctx.beginPath(); ctx.arc(e.x + Math.sin(tt * 1.5 + e.w) * 30, y, e.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------- world (table + album) ----------
function drawAlbum(t) {
  // leather back cover + page block under everything
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.filter = 'blur(18px)'; ctx.fillRect(PX - 10, PY + 30, PW + 50, PH + 30); ctx.filter = 'none';
  ctx.fillStyle = '#4a1014'; ctx.fillRect(PX - 22, PY - 20, PW + 44, PH + 40);
  ctx.fillStyle = '#e4d3ae'; for (let i = 0; i < 6; i++) ctx.fillRect(PX - 12 + i * 2, PY - 8 + i * 2, PW + 8, PH + 12);
  // spine
  ctx.fillStyle = '#3a0b0f'; ctx.fillRect(PX + PW, PY - 20, 24, PH + 40);

  const open = prog(t, OPEN[0], OPEN[1]);
  // which page is on top, and which one is turning
  let top = NPLACES, turning = -1, f = 0;
  for (let i = 0; i < NPLACES; i++) {
    const fs = T0 + (i + 1) * P - FLIP;
    if (t < fs) { top = i; break; }
    if (t < fs + FLIP) { top = i + 1; turning = i; f = easeInOut((t - fs) / FLIP); break; }
  }
  ctx.drawImage(renderPage(pageCvs[0], top, t), PX, PY);
  if (turning >= 0) {
    turnShadow(f);
    drawTurning(renderPage(pageCvs[1], turning, t), f, '#e8d6b0');
  }
  if (open < 1) {
    const c = coverFull.getContext('2d'); c.drawImage(cover, 0, 0);
    withCtx(c, () => { ctx.save(); ctx.translate(-PX, -PY); drawCoverText(1); ctx.restore(); });
    if (open > 0) turnShadow(easeInOut(open));
    drawTurning(coverFull, easeInOut(open), '#5a1418');
  }
}
function drawWorld(t) {
  ctx.drawImage(wood, 0, 0);
  drawAlbum(t);
  // props visible in the intro
  if (t < 3.2) {
    mabkhara(170, 1830, .9);
    zayana(880, 1900, .85, t, clamp(1 - prog(t, 2.2, 3.0)));
  }
}

// ---------- finale (full frame) ----------
function finale(u, t) {
  const g = ctx.createRadialGradient(W / 2, 760, 60, W / 2, 900, 1300);
  g.addColorStop(0, '#f6c75a'); g.addColorStop(.35, '#c4202b'); g.addColorStop(1, '#3a0408');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 760); ctx.rotate(t * .08);
  for (let i = 0; i < 24; i++) { ctx.rotate(Math.PI / 12); ctx.fillStyle = 'rgba(255,230,160,.08)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -2200); ctx.lineTo(90, -2200); ctx.fill(); }
  ctx.restore();
  embers(u);
  const fk = easeOut(prog(u, 0, .8));
  ctx.save(); ctx.translate(W / 2, 800); ctx.scale(lerp(.85, 1, fk), lerp(.85, 1, fk));
  ctx.fillStyle = GOLD; ctx.fillRect(-470, -250, 14, 1000);
  ctx.beginPath(); ctx.arc(-463, -258, 16, 0, Math.PI * 2); ctx.fill();
  wavingFlag(-456, -230, 900, 450, t, .06, { speed: 3.5 });
  ctx.restore();
  smoke(150, H + 40, t, .6, 1600); smoke(960, H + 40, t + 3, .5, 1500);
  const p1 = easeOut(prog(u, .3, 1.1)), p2 = easeOut(prog(u, .7, 1.5));
  text('كل عام', W / 2, 300, { size: 130, alpha: p1, scale: lerp(1.15, 1, p1), fill: WHITE, stroke: '#3a0408', strokeW: 16, glow: 'rgba(0,0,0,.4)' });
  text('وعُمان بخير', W / 2, 450, { size: 170, alpha: p2, scale: lerp(1.15, 1, p2), fill: 'gold', stroke: '#3a0408', strokeW: 20, glow: 'rgba(255,200,90,.5)', glowBlur: 40 });
  const pk = easeOut(prog(u, 1.4, 2.0));
  ctx.save(); ctx.globalAlpha = pk; ctx.translate(W / 2, 1140);
  ctx.fillStyle = 'rgba(40,6,10,.85)'; ctx.beginPath(); ctx.roundRect(-310, -48, 620, 96, 48); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
  text('اليوم الوطني · ٢٠ نوفمبر', W / 2, 1142, { size: 50, font: 'Cairo', weight: 900, alpha: pk, fill: '#ffe7b0' });
  const zk = easeBack(prog(u, .9, 1.6));
  zayana(W / 2, lerp(H + 700, 1860, zk), 1.15, t);
  text('من ألبوم زيانه.. بكل حب', W / 2, 1255, { size: 46, font: 'Reem', weight: 700, alpha: easeOut(prog(u, 2.2, 2.8)), fill: '#fff1d6' });
}

// ---------- master render ----------
function render(t) {
  ctx_t = t; ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  if (t < FINALE + .45) {
    // camera: intro pull-in, gentle drift, then dive into the last photo
    let s = lerp(.8, 1, easeInOut(prog(t, 0, 2.8))) * (1 + .02 * Math.sin(t * .6));
    let cx = W / 2, cy = 960;
    const z = easeInOut(prog(t, ZOOM[0], ZOOM[1]));
    if (z > 0) { s = lerp(s, 1080 / PS * 1.02, z); cy = lerp(960, PY + 640 - 420 + 30 + PS / 2, z); }
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-cx, -cy);
    drawWorld(t);
    ctx.restore();
    // warm lamp light + frankincense smoke + dust
    const lg = ctx.createRadialGradient(200, 200, 50, 300, 400, 1500);
    lg.addColorStop(0, 'rgba(255,200,120,.25)'); lg.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    smoke(170 + (1 - clamp(t / 2.8)) * 0, 1680, t, clamp(1 - prog(t, 3, 5)) * .9 + .25, 1500);
    dust(t, 1);
  }
  if (t >= FINALE) {
    ctx.save(); ctx.globalAlpha = easeInOut(prog(t, FINALE, FINALE + .45));
    finale(t - FINALE, t);
    ctx.restore();
    // golden flash on the cut
    const fl = Math.exp(-(t - FINALE - .25) * 6) * (t > FINALE + .25 ? 1 : prog(t, FINALE, FINALE + .25));
    ctx.fillStyle = `rgba(255,236,190,${clamp(fl) * .55})`; ctx.fillRect(0, 0, W, H);
  }
  // vignette + fade in/out
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - prog(t, 0, .5), prog(t, DURATION - .6, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  await Promise.all([
    document.fonts.load('100px "Lalezar"'), document.fonts.load('900 100px "Cairo"'), document.fonts.load('700 100px "Reem"'),
    bodyImg.decode(), armImg.decode(),
  ]);
  return true;
})();
window.render = render;
window.META = { W, H, DURATION, FPS };
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script>
</body>
