<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>زيانه — وش تقدر تسوي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@700;800&display=swap">
<style>
  :root { --red:#d8232f; --green:#0f8a43; --gold:#e3a72f; --ink:#2a1a12; --paper:#fffaf0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; font-family: "Lalezar", Tahoma, sans-serif;
    background: linear-gradient(#6fd0e6 0%, #a8e3cf 45%, #ffe3a3 78%, #f2b46b 100%); }
  #dots { position: absolute; inset: 0; opacity: .14; background-image: radial-gradient(circle at 20px 20px, #fff 3px, transparent 4px); background-size: 40px 40px; }
  #sun { position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(#fff6c8, #ffd66b 60%, transparent 70%); opacity: .8; }
  .zay svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .zay #arm { transform-box: fill-box; transform-origin: 25% 90%; }
  .zay #legL, .zay #legR { transform-box: fill-box; transform-origin: 50% 0; }
  .zay #eyesShut, .zay #mouthO { display: none; }
  .zay.blink #eyesOpen { display: none; } .zay.blink #eyesShut { display: inline; }
  .zay.talk #smile { display: none; } .zay.talk #mouthO { display: inline; }
  #big { position: absolute; width: 262px; height: 540px; left: 139px; top: 380px; transform-origin: 50% 100%; filter: drop-shadow(0 12px 14px rgba(0,0,0,.25)); }

  .cap { position: absolute; left: 20px; right: 20px; top: 110px; text-align: center; direction: rtl; color: #fff; font-size: 52px; line-height: 1.25;
    text-shadow: 0 4px 0 var(--ink), 0 0 24px rgba(0,0,0,.3); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; opacity: 0; }
  .cap small { display: block; font-size: 32px; color: #fff3c4; margin-top: 6px; }

  /* the computer */
  #pc { position: absolute; left: 30px; top: 330px; width: 480px; opacity: 0; transform-origin: 50% 50%; }
  #screen { position: relative; height: 320px; border: 14px solid #1f2430; border-radius: 18px; overflow: hidden;
    background: linear-gradient(135deg, #3d7bd9, #6aa7f0 55%, #9ad0ff); }
  #stand { width: 120px; height: 46px; margin: 0 auto; background: linear-gradient(#2c3240, #1f2430); clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%); }
  #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: rgba(20,24,34,.85); }
  #taskbar i { position: absolute; top: 8px; width: 18px; height: 18px; border-radius: 4px; }
  #win { position: absolute; left: 230px; top: 70px; width: 200px; height: 150px; background: #fff; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,.3); overflow: hidden; }
  #win b { display: block; height: 22px; background: #e9edf3; }
  #win p { margin: 10px 12px; height: 8px; border-radius: 4px; background: #dfe5ee; }
  #mini { position: absolute; width: 46px; height: 95px; left: 0; top: 0; transform-origin: 50% 100%; }
  #cursor { position: absolute; width: 26px; height: 34px; opacity: 0; }
  #miniBubble { position: absolute; direction: rtl; font: 800 18px "Baloo Bhaijaan 2", Tahoma, sans-serif; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 2px 10px 0; opacity: 0; white-space: nowrap; }

  /* the phone */
  #phone { position: absolute; left: 115px; top: 300px; width: 310px; height: 620px; border-radius: 42px; background: #1a1c22; padding: 12px; opacity: 0;
    box-shadow: 0 24px 50px rgba(0,0,0,.35); }
  #phone .scr { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: #fff; }
  #phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  #check { position: absolute; left: 50%; top: 52%; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; background: #1b9e55; color: #fff; font: 800 90px/130px Tahoma, sans-serif; text-align: center; border: 6px solid #fff; opacity: 0; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
  #cheer { position: absolute; left: 40px; right: 40px; top: 470px; direction: rtl; text-align: center; font: 800 34px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: var(--ink);
    background: var(--paper); border: 5px solid var(--ink); border-radius: 26px; padding: 10px 14px 4px; box-shadow: 6px 6px 0 rgba(0,0,0,.3); opacity: 0; }
  .star { position: absolute; font-size: 40px; opacity: 0; }

  /* stickers */
  .stk { position: absolute; width: 210px; height: 210px; opacity: 0; filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }

  #brand { position: absolute; left: 60px; right: 60px; top: 260px; padding: 24px 20px 16px; border-radius: 28px; background: var(--paper); border: 5px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(0,0,0,.3); text-align: center; direction: rtl; opacity: 0; }
  #brand .name { font-size: 64px; color: var(--red); line-height: 1.1; }
  #brand .en { font: 800 22px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: var(--green); letter-spacing: .12em; }
  #brand .by { font: 800 24px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: var(--ink); }
  #follow { position: absolute; left: 50%; top: 250px; padding: 10px 46px 4px; border-radius: 999px; background: #3b82f6; color: #fff; font-size: 44px;
    border: 4px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,.25); opacity: 0; white-space: nowrap; direction: rtl; }
  #hand { position: absolute; left: 300px; top: 318px; font-size: 64px; opacity: 0; }
  .spark { position: absolute; color: #fff; font-size: 30px; opacity: 0; text-shadow: 0 0 12px #ffd76a; }
  #tag { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; direction: rtl; font: 800 20px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: rgba(42,26,18,.75); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="sun"></div><div id="dots"></div>

  <div id="pc"><div id="screen">
      <div id="win"><b></b><p></p><p style="width:60%"></p><p></p><p style="width:40%"></p></div>
      <div id="taskbar"><i style="left:200px;background:#4fa3ff"></i><i style="left:226px;background:#ffd34d"></i><i style="left:252px;background:#31c46c"></i><i style="left:278px;background:#ff6b6b"></i></div>
      <div id="mini" class="zay"></div>
      <div id="miniBubble">وييي! 🎢</div>
      <svg id="cursor" viewBox="0 0 26 34"><path d="M2 2 L2 28 L9 21 L14 32 L19 30 L14 19 L24 19 Z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>
    </div><div id="stand"></div></div>

  <div id="phone"><div class="scr"><img id="g1" src="assets/game-play.png" alt=""><img id="g2" src="assets/game-win.png" alt="" style="opacity:0"><div id="check">✓</div></div></div>
  <div id="cheer">عاشت إيدك يا مريم! 🌟</div>
  <div id="stars"></div>

  <img class="stk" id="s1" src="../stickers/zayana-hala.png" alt="">
  <img class="stk" id="s2" src="../stickers/zayana-tislam.png" alt="">
  <img class="stk" id="s3" src="../stickers/zayana-sabah.png" alt="">
  <img class="stk" id="s4" src="../stickers/zayana-eid.png" alt="">

  <div id="big" class="zay"></div>
  <div id="brand"><div class="by">كل هذا من تصميم</div><div class="name">زيان للتصميم</div><div class="en">ZAYAN DESIGN</div></div>
  <div id="follow">متابعة +</div>
  <div id="hand">👆</div>

  <div class="cap" id="c0">وش تقدر تسوي زيانه؟ 🤔</div>
  <div class="cap" id="c1">تعيش على سطح مكتبك 💻<small>تمشي وتنط على النوافذ</small></div>
  <div class="cap" id="c2">شيلها وارميها! 🎢</div>
  <div class="cap" id="c3">لعبة قطار تعليمية 🚂<small>آحاد · عشرات · مئات</small></div>
  <div class="cap" id="c4">تشجّع كل طفل باسمه 💚</div>
  <div class="cap" id="c5">ملصقات واتساب 💬</div>
  <div class="cap" id="c6">تابعوني! 💚<small>والجاي أحلى 🎁</small></div>
  <div id="sparks"></div>
  <div id="tag">زيانه · من تصميم زيان للتصميم</div>
  <div id="flash"></div>
</div>
<script src="zayana-sprite.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$('big').innerHTML = ZAYANA_SVG; $('mini').innerHTML = ZAYANA_SVG;
const stars = $('stars');
for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'star'; s.textContent = i % 2 ? '⭐' : '✨'; stars.appendChild(s); }
const sparks = $('sparks');
for (let i = 0; i < 12; i++) { const s = document.createElement('div'); s.className = 'spark'; s.textContent = '✦'; sparks.appendChild(s); }

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function pop(el, t, a, b, extra = '') {
  const pin = seg(t, a, a + .4), pout = seg(t, b - .3, b), on = t >= a && t < b;
  el.style.opacity = on ? Math.min(pin * 1.5, 1 - pout) : 0;
  el.style.transform = `${extra} scale(${on ? (0.6 + 0.4 * back(pin)) * (1 - .1 * pout) : .6})`;
}
// her voice (video time): the lines, from the voice track + 0.6 s
const OFF = 0.6;
const SPEAK = [[0, 1.54], [1.86, 2.84], [3.14, 3.79], [4.02, 5.22], [5.47, 7.79], [8.01, 10.2], [10.36, 11.06], [11.31, 12.85], [13.07, 15.55],
  [15.78, 17.91], [18.16, 19.58], [19.81, 21.45], [21.78, 24.18], [24.42, 25.04], [25.26, 26.43]].map(([a, b]) => [a + OFF, b + OFF]);
const speaking = (t) => SPEAK.some(([a, b]) => t > a && t < b);
function face(z, t) { z.classList.toggle('blink', t % 3.1 > 2.95); z.classList.toggle('talk', speaking(t) && Math.floor(t * 8) % 2 === 0); }

// scene times
const T = { s1: 3.7, s2: 8.6, s3: 11.85, s4: 16.35, s5: 20.35, s6: 22.35, s7: 24.95, end: 28.2 };
window.DURATION = 28.6;

window.render = function (t) {
  // big Zayana: intro, brand, follow
  const big = $('big');
  const bigOn = t < T.s1 + .3 || t > T.s6 - .2;
  const bin = easeOut(seg(t, 0, .5)), bout = seg(t, T.s1 - .1, T.s1 + .3), bback = easeOut(seg(t, T.s6 - .2, T.s6 + .3));
  let by = 0, bs = 1;
  if (t < T.s1 + .3) { by = 600 * (1 - bin) + 600 * bout * bout; }
  else { by = 600 * (1 - bback); }
  if (t > T.s6 - .2 && t < T.s7) { by += 170; bs = .7; }
  if (t > T.s7) { const p = easeInOut(seg(t, T.s7, T.s7 + .5)); by += 170 * (1 - p); bs = .7 + .3 * p; }
  by += Math.sin(t * 3) * 3;
  big.style.opacity = bigOn ? 1 : 0;
  big.style.transform = `translateY(${by}px) scale(${bs})`;
  big.querySelector('#arm').style.transform = (t < T.s1) || t > T.s7 ? `rotate(${-26 * Math.abs(Math.sin(t * 6))}deg)` : '';
  face(big, t);

  // captions
  pop($('c0'), t, .3, T.s1);
  pop($('c1'), t, T.s1 + .1, T.s2);
  pop($('c2'), t, T.s2 + .1, T.s3);
  pop($('c3'), t, T.s3 + .1, T.s4);
  pop($('c4'), t, T.s4 + .1, T.s5);
  pop($('c5'), t, T.s5 + .05, T.s6);
  pop($('brand'), t, T.s6 + .1, T.s7, `rotate(${-2 + Math.sin(t * 3) * 1.5}deg)`);
  pop($('c6'), t, T.s7 + .1, T.end);
  pop($('follow'), t, T.s7 + .5, T.end, 'translateX(-50%)');
  const h = $('hand'); h.style.opacity = t > T.s7 + .8 && t < T.end - .1 ? 1 : 0; h.style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * -18}px)`;

  // the computer: walk on the taskbar, jump on the window, get thrown
  const pc = $('pc'), pcIn = easeOut(seg(t, T.s1, T.s1 + .5)), pcOut = seg(t, T.s3 - .3, T.s3);
  pc.style.opacity = t > T.s1 && t < T.s3 ? Math.min(pcIn * 1.4, 1 - pcOut) : 0;
  pc.style.transform = `translateY(${80 * (1 - pcIn)}px) scale(${0.9 + .1 * pcIn - .2 * pcOut})`;
  const mini = $('mini'), W = 452, floor = 292 - 34, winTop = 70, winX0 = 230, winX1 = 430;
  let mx = 30, my = floor, walking = false, air = false, mr = 0;
  if (t < T.s1 + 2.6) { const p = seg(t, T.s1 + .3, T.s1 + 2.6); mx = 30 + 150 * p; walking = p > 0 && p < 1; }
  else if (t < T.s1 + 3.3) { const p = seg(t, T.s1 + 2.6, T.s1 + 3.3); mx = 180 + 120 * p; my = floor + (winTop - floor) * p - Math.sin(p * Math.PI) * 90; air = true; }
  else if (t < T.s2 + .7) { mx = 300; my = winTop; }
  // the cursor comes, picks her up, swings and throws
  const cur = $('cursor');
  let cx = 420, cy = 260, cOn = t > T.s2 && t < T.s2 + 2.0;
  if (t >= T.s2 && t < T.s2 + .7) { const p = easeInOut(seg(t, T.s2, T.s2 + .7)); cx = 420 + (300 - 420) * p; cy = 260 + (winTop - 50 - 260) * p; }
  if (t >= T.s2 + .7 && t < T.s2 + 1.5) {
    const p = seg(t, T.s2 + .7, T.s2 + 1.5);
    cx = 300 - 120 * p + Math.sin(p * 9) * 20; cy = winTop - 50 - 30 * p;
    mx = cx; my = cy + 50; mr = Math.sin(p * 9) * 18; air = true;
  }
  if (t >= T.s2 + 1.5 && t < T.s3) {
    const d = t - (T.s2 + 1.5);
    let x = 180 + 420 * d, y = (winTop - 30) - 600 * d + 1300 * d * d;    // thrown up and to the right
    if (x > W - 30) x = 2 * (W - 30) - x;                                    // bounces off the edge
    if (y >= floor) { y = floor; } else air = true;
    mx = x; my = y; mr = y < floor ? d * 600 : 0;
    cx = 180 + 40 * Math.min(d, .3); cy = winTop - 80;
  }
  cur.style.opacity = cOn ? 1 : 0; cur.style.transform = `translate(${cx}px, ${cy}px)`;
  mini.style.transform = `translate(${mx - 23}px, ${my - 95}px) rotate(${mr}deg)`;
  mini.querySelector('#legL').style.transform = walking ? `rotate(${Math.sin(t * 12) * 16}deg)` : air ? 'rotate(14deg)' : '';
  mini.querySelector('#legR').style.transform = walking ? `rotate(${-Math.sin(t * 12) * 16}deg)` : air ? 'rotate(-18deg)' : '';
  mini.querySelector('#arm').style.transform = air ? `rotate(-30deg)` : '';
  face(mini, t);
  const mb = $('miniBubble'); mb.style.opacity = t > T.s2 + 1.4 && t < T.s3 - .2 ? 1 : 0; mb.style.transform = `translate(${mx - 40}px, ${my - 135}px)`;

  // the phone: the train game, a tick, then Maryam is cheered on
  const ph = $('phone'), pin = easeOut(seg(t, T.s3, T.s3 + .5)), pout = seg(t, T.s5 - .3, T.s5);
  ph.style.opacity = t > T.s3 && t < T.s5 ? Math.min(pin * 1.4, 1 - pout) : 0;
  ph.style.transform = `translateY(${300 * (1 - pin)}px) rotate(${(1 - pin) * 8}deg) scale(${1 - .15 * pout})`;
  $('g2').style.opacity = seg(t, T.s4 - .3, T.s4);
  const ck = seg(t, T.s3 + 2.6, T.s3 + 3.0); $('check').style.opacity = t > T.s3 + 2.6 && t < T.s4 - .2 ? 1 : 0; $('check').style.transform = `scale(${back(ck)})`;
  pop($('cheer'), t, T.s4 + 1.6, T.s5, `rotate(${Math.sin(t * 4) * 2}deg)`);
  [...stars.children].forEach((s, i) => {
    const d = t - (T.s4 + 1.8), a = i / 10 * Math.PI * 2;
    s.style.opacity = d > 0 && d < 1.6 ? 1 - d / 1.6 : 0;
    s.style.left = 260 + Math.cos(a) * (40 + 220 * easeOut(clamp(d / 1.2))) + 'px';
    s.style.top = 500 + Math.sin(a) * (40 + 200 * easeOut(clamp(d / 1.2))) + 'px';
  });

  // stickers pop in one by one
  [['s1', 50, 330], ['s2', 280, 330], ['s3', 50, 580], ['s4', 280, 580]].forEach(([id, x, y], i) => {
    const a = T.s5 + .15 + i * .3, el = $(id);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    pop(el, t, a, T.s6, `rotate(${(i % 2 ? 4 : -4) + Math.sin(t * 3 + i) * 3}deg)`);
  });

  // sparkles around the brand and the follow button
  [...sparks.children].forEach((s, i) => {
    const on = (t > T.s6 + .3 && t < T.s7) || (t > T.s7 + .5 && t < T.end);
    const a = i / 12 * Math.PI * 2 + t * .8, r = 210 + Math.sin(t * 3 + i) * 20;
    s.style.left = 270 + Math.cos(a) * r - 12 + 'px'; s.style.top = 340 + Math.sin(a) * r * .5 + 'px';
    s.style.opacity = on ? (0.5 + 0.5 * Math.sin(t * 6 + i)) : 0;
  });

  // a short white flash between scenes
  let fl = 0; for (const k of [T.s1, T.s3, T.s5, T.s6]) { const d = Math.abs(t - k); if (d < .12) fl = Math.max(fl, .5 * (1 - d / .12)); }
  $('flash').style.opacity = fl;
  $('stage').style.opacity = 1 - seg(t, T.end, DURATION);
};
render(0);
</script>
</body>
</html>
