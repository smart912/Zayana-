<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>زيانه — فيديو تعريفي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@700;800&display=swap">
<style>
  :root { --red:#d8232f; --green:#0f8a43; --gold:#e3a72f; --ink:#2a1a12; --paper:#fffaf0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; font-family: "Lalezar", Tahoma, sans-serif; }
  .layer { position: absolute; inset: 0; }
  #night { background: radial-gradient(120% 70% at 50% 75%, #3a2350 0%, #1b1430 55%, #0e0a1c 100%); }
  #day { background: linear-gradient(#ffcf7a 0%, #ff9a5a 38%, #e8556a 72%, #7b2d5c 100%); }
  #pattern { opacity: .13; background-image: radial-gradient(circle at 20px 20px, #fff 3px, transparent 4px), radial-gradient(circle at 0 0, #fff 2px, transparent 3px); background-size: 40px 40px; }
  .star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff6d8; }
  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(#c79a62, #a87a48); }

  /* the door */
  #door { position: absolute; left: 120px; top: 300px; width: 300px; height: 500px; transform-origin: 50% 100%; }
  #arch { position: absolute; inset: 0; border-radius: 150px 150px 0 0; background: #d8c3a0; box-shadow: inset 0 0 0 10px #bfa77f, 0 20px 50px rgba(0,0,0,.45); }
  #hole { position: absolute; left: 22px; right: 22px; top: 22px; bottom: 0; border-radius: 128px 128px 0 0; overflow: hidden; background: #120c08; perspective: 900px; }
  #glow { position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 60%, #fff2c4 0%, #ffd27a 45%, #c77a2c 100%); opacity: 0; }
  .leaf { position: absolute; top: 0; bottom: 0; width: 50%;
    background:
      radial-gradient(circle, #2a1a10 3.5px, transparent 4.5px) 0 0 / 32px 44px,
      repeating-linear-gradient(90deg, #6e4930 0 26px, #5f3d27 26px 28px);
    box-shadow: inset 0 0 0 5px #4a2f1d; }
  #leafL { left: 0; transform-origin: 0 50%; }
  #leafR { right: 0; transform-origin: 100% 50%; }
  .knocker { position: absolute; top: 46%; width: 34px; height: 34px; border-radius: 50%; border: 5px solid var(--gold); }
  #leafL .knocker { right: 14px; } #leafR .knocker { left: 14px; }
  #peek { position: absolute; width: 230px; height: 474px; bottom: -150px; left: -150px; }

  .zay svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .zay #arm { transform-box: fill-box; transform-origin: 25% 90%; }
  .zay #legL, .zay #legR { transform-box: fill-box; transform-origin: 50% 0; }
  .zay #eyesShut, .zay #mouthO { display: none; }
  .zay.blink #eyesOpen { display: none; } .zay.blink #eyesShut { display: inline; }
  .zay.talk #smile { display: none; } .zay.talk #mouthO { display: inline; }
  #main { position: absolute; width: 262px; height: 540px; left: 139px; top: 380px; transform-origin: 50% 100%; filter: drop-shadow(0 12px 14px rgba(0,0,0,.3)); }

  /* words */
  .cap { position: absolute; left: 24px; right: 24px; top: 120px; text-align: center; direction: rtl; color: #fff; font-size: 54px; line-height: 1.25;
    text-shadow: 0 4px 0 var(--ink), 0 0 24px rgba(0,0,0,.35); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; opacity: 0; }
  .cap small { display: block; font-size: 34px; color: #fff3c4; margin-top: 6px; }
  #bubble { position: absolute; left: 150px; top: 250px; direction: rtl; font: 800 30px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: var(--ink);
    background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; padding: 8px 20px 4px; box-shadow: 5px 5px 0 rgba(0,0,0,.3); opacity: 0; white-space: nowrap; }
  #bubble::after { content: ""; position: absolute; left: 40px; top: 100%; border: 13px solid transparent; border-top-color: var(--ink); }
  .emo { position: absolute; font-size: 70px; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fffbe8; opacity: 0; }

  #car { position: absolute; width: 360px; height: 140px; left: 140px; top: 760px; transform-origin: 0 100%; }
  #speed { position: absolute; right: -150px; top: 30px; width: 170px; height: 80px; opacity: 0;
    background: repeating-linear-gradient(180deg, transparent 0 12px, rgba(255,255,255,.85) 12px 16px, transparent 16px 26px); }

  #brand { position: absolute; left: 60px; right: 60px; top: 300px; padding: 26px 20px 18px; border-radius: 28px; background: var(--paper); border: 5px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(0,0,0,.3); text-align: center; direction: rtl; opacity: 0; }
  #brand .name { font-size: 64px; color: var(--red); line-height: 1.1; }
  #brand .en { font: 800 22px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: var(--green); letter-spacing: .12em; }
  #brand .by { font: 800 24px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: var(--ink); }
  .spark { position: absolute; color: #fff6c8; font-size: 34px; opacity: 0; text-shadow: 0 0 12px #ffd76a; }

  #follow { position: absolute; left: 50%; top: 290px; transform: translateX(-50%); padding: 10px 46px 4px; border-radius: 999px; background: #3b82f6; color: #fff;
    font-size: 44px; border: 4px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,.25); opacity: 0; white-space: nowrap; direction: rtl; }
  #hand { position: absolute; left: 300px; top: 360px; font-size: 64px; opacity: 0; }
  #tag { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; direction: rtl; font: 800 20px "Baloo Bhaijaan 2", Tahoma, sans-serif; color: rgba(255,255,255,.85); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="night"></div>
  <div class="layer" id="day"></div>
  <div class="layer" id="pattern"></div>
  <div id="stars"></div>
  <div id="ground"></div>

  <div id="door">
    <div id="arch"></div>
    <div id="hole">
      <div id="glow"></div>
      <div id="peek" class="zay"></div>
      <div class="leaf" id="leafL"><div class="knocker"></div></div>
      <div class="leaf" id="leafR"><div class="knocker"></div></div>
    </div>
  </div>

  <div id="car">
    <div id="speed"></div>
    <svg viewBox="0 0 360 140" width="360" height="140" style="transform:scaleX(-1)">
      <ellipse cx="185" cy="128" rx="170" ry="9" fill="#000" opacity=".25"/>
      <path d="M10 100 Q10 80 40 75 L110 70 Q150 40 200 38 L250 40 Q285 50 320 72 Q350 78 352 95 L352 108 Q350 116 338 116 L22 116 Q10 113 10 100Z" fill="#d8232f" stroke="#2a1a12" stroke-width="4"/>
      <path d="M125 70 Q155 48 200 46 L244 48 Q264 55 284 70Z" fill="#1d2433"/>
      <path d="M200 46 L198 70" stroke="#d8232f" stroke-width="5"/>
      <path d="M30 92 L330 88" stroke="#e3a72f" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="340" cy="86" rx="9" ry="6" fill="#fff3a8" stroke="#2a1a12" stroke-width="2"/>
      <rect x="10" y="84" width="10" height="9" rx="2" fill="#7a0d16"/>
      <circle cx="180" cy="102" r="10" fill="#e3a72f" stroke="#2a1a12" stroke-width="2"/>
      <text x="180" y="107" text-anchor="middle" font-family="Tahoma" font-weight="bold" font-size="13" fill="#2a1a12">Z</text>
      <g id="wheel1"><circle cx="85" cy="114" r="25" fill="#1b1b1b"/><circle cx="85" cy="114" r="13" fill="#c9d1d6"/><path d="M85 101 V127 M72 114 H98" stroke="#7d868c" stroke-width="4"/></g>
      <g id="wheel2"><circle cx="285" cy="114" r="25" fill="#1b1b1b"/><circle cx="285" cy="114" r="13" fill="#c9d1d6"/><path d="M285 101 V127 M272 114 H298" stroke="#7d868c" stroke-width="4"/></g>
    </svg>
  </div>

  <div id="main" class="zay"></div>

  <div class="cap" id="c0">في أحد جاي… 👀</div>
  <div id="bubble">هلا والله! 👋</div>
  <div class="cap" id="c1">أنا زيانه 🧕<small>بنت عُمانية من قلب عُمان</small></div>
  <div class="cap" id="c2">أحب القهوة والتمر ☕<small>والسوالف الحلوة مع الأهل</small></div>
  <div class="cap" id="c3">وعندي سيارة سريعة! 🏎️<small>بسرعة الريح 💨</small></div>
  <div class="cap" id="c4">مين صمّمني؟ ✨</div>
  <div id="brand"><div class="by">صمّمتني</div><div class="name">زيان للتصميم</div><div class="en">ZAYAN DESIGN</div></div>
  <div class="cap" id="c5">تابعوني! 💚<small>الأيام الجاية فيها مفاجآت 🎁</small></div>
  <div id="follow">متابعة +</div>
  <div id="hand">👆</div>
  <div class="emo" id="e1">☕</div><div class="emo" id="e2">🌴</div><div class="emo" id="e3">☕</div>
  <div id="sparks"></div>
  <div id="tag">زيانه · من تصميم زيان للتصميم</div>
  <div id="flash"></div>
</div>
<script src="zayana-sprite.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$('peek').innerHTML = ZAYANA_SVG; $('main').innerHTML = ZAYANA_SVG;
// stars
const stars = $('stars');
for (let i = 0; i < 40; i++) { const s = document.createElement('div'); s.className = 'star'; s.style.left = (Math.sin(i * 12.9) * 0.5 + 0.5) * 540 + 'px'; s.style.top = (Math.sin(i * 7.3) * 0.5 + 0.5) * 520 + 'px'; s.dataset.p = i; stars.appendChild(s); }
const sparks = $('sparks');
for (let i = 0; i < 12; i++) { const s = document.createElement('div'); s.className = 'spark'; s.textContent = '✦'; s.dataset.i = i; sparks.appendChild(s); }

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function pop(el, t, a, b, extra = '') {           // pops in at a, fades out at b
  const pin = seg(t, a, a + .4), pout = seg(t, b - .3, b);
  const on = t >= a && t < b;
  el.style.opacity = on ? Math.min(pin * 1.5, 1 - pout) : 0;
  el.style.transform = `${extra} scale(${on ? (0.6 + 0.4 * back(pin)) * (1 - .1 * pout) : .6})`;
}
let SPEAKING = false, TT = 0;
function talk(z, t, windows) { z.classList.toggle('talk', SPEAKING && Math.floor(TT * 8) % 2 === 0); }
function blink(z, t) { const k = t % 3.1; z.classList.toggle('blink', k > 2.95); }

// video time -> scene time: the scenes stretch to fit Zayana's voice
const KV = [0, 9.3, 12.6, 16.2, 19.4, 23.4, 26.6], KD = [0, 9.3, 11.8, 14.0, 17.0, 19.45, 22.6];
function mapT(T) { for (let i = 1; i < KV.length; i++) if (T <= KV[i]) return KD[i-1] + (T - KV[i-1]) / (KV[i] - KV[i-1]) * (KD[i] - KD[i-1]); return KD[KD.length-1]; }
// when she is speaking (video time), from the voice track
const SPEAK = [[6.9, 7.9], [9.45, 12.15], [12.75, 15.8], [16.55, 19.2], [19.5, 20.75], [20.9, 23.0], [23.5, 26.0]];
window.render = function (T) {
  const t = mapT(T); TT = T;
  const speaking = SPEAK.some(([a, b]) => T > a && T < b); SPEAKING = speaking;
  // background: night → day as the door opens
  const day = seg(t, 5.2, 7.8);
  $('day').style.opacity = day; $('pattern').style.opacity = .13 * day;
  [...stars.children].forEach((s) => { s.style.opacity = (1 - day) * (0.4 + 0.6 * Math.abs(Math.sin(t * 2 + +s.dataset.p))); });
  $('ground').style.opacity = 1;

  // door: knocks, then opens; it steps back once Zayana is out
  const knocks = [1.3, 1.75, 2.2, 3.4];
  let shake = 0; for (const k of knocks) { const d = t - k; if (d > 0 && d < .18) shake = Math.sin(d * 90) * 4 * (1 - d / .18); }
  const open = easeInOut(seg(t, 4.4, 5.8));
  $('leafL').style.transform = `rotateY(${-100 * open}deg) translateX(${shake}px)`;
  $('leafR').style.transform = `rotateY(${100 * open}deg) translateX(${shake}px)`;
  $('glow').style.opacity = open;
  const away = easeInOut(seg(t, 9, 9.8));
  $('door').style.transform = `translateY(${-40 * away}px) scale(${1 - .35 * away})`;
  $('door').style.opacity = 1 - .85 * away;

  // she peeks in from the side of the doorway and waves
  const peekIn = easeOut(seg(t, 5.9, 6.8));
  const peek = $('peek');
  peek.style.transform = `translate(${-150 + 210 * peekIn}px, ${-180 * peekIn}px) rotate(${14 - 8 * peekIn}deg)`;
  peek.style.opacity = t < 9.1 ? 1 : 0;
  peek.querySelector('#arm').style.transform = t > 6.8 && t < 9 ? `rotate(${-26 * Math.abs(Math.sin((t - 6.8) * 6))}deg)` : '';
  blink(peek, t); talk(peek, t, [[6.9, 7.9]]);
  pop($('bubble'), t, 6.9, 9);

  // the flash, then Zayana stands in front
  const fl = seg(t, 8.85, 9.1) * (1 - seg(t, 9.1, 9.6));
  $('flash').style.opacity = fl * .95;
  const z = $('main');
  const shown = t >= 9.05;
  z.style.opacity = shown ? 1 : 0;
  let zx = 0, zy = 0, zs = 1, zr = 0;
  const hop = (a) => { const d = t - a; return d > 0 && d < .45 ? -Math.sin(d / .45 * Math.PI) * 50 : 0; };
  zy += hop(9.1) + hop(11.8) + hop(16.6) + hop(19.4);
  zy += Math.sin(t * 3) * 3;
  // the car scene: she steps aside to the left
  const aside = easeInOut(seg(t, 14.0, 14.6)) * (1 - easeInOut(seg(t, 17.0, 17.6)));
  zx -= 135 * aside; zs -= .12 * aside;
  // the brand scene: she shrinks down to the bottom
  const low = easeInOut(seg(t, 17.0, 17.6)) * (1 - easeInOut(seg(t, 19.4, 19.9)));
  zy += 170 * low; zs -= .18 * low;
  if (t > 19.4) zr = Math.sin((t - 19.4) * 5) * 4 * (1 - seg(t, 21, 22));
  z.style.transform = `translate(${zx}px, ${zy}px) scale(${zs}) rotate(${zr}deg)`;
  z.querySelector('#arm').style.transform = (t > 9.1 && t < 10.4) || (t > 19.5) ? `rotate(${-26 * Math.abs(Math.sin(t * 6))}deg)` : '';
  const air = [9.1, 11.8, 16.6, 19.4].some((a) => t - a > 0 && t - a < .45);
  z.querySelector('#legL').style.transform = air ? 'rotate(14deg)' : '';
  z.querySelector('#legR').style.transform = air ? 'rotate(-18deg)' : '';
  blink(z, t); talk(z, t, [[9.3, 10.8], [11.9, 13.2], [14.4, 15.6], [17.0, 17.9], [19.6, 21.0]]);

  // the words
  pop($('c0'), t, .4, 4.6);
  pop($('c1'), t, 9.3, 11.75);
  pop($('c2'), t, 11.85, 14.0);
  pop($('c3'), t, 14.3, 16.9);
  pop($('c4'), t, 17.0, 18.0);
  pop($('brand'), t, 17.7, 19.45, `rotate(${-2 + Math.sin(t * 3) * 1.5}deg)`);
  pop($('c5'), t, 19.5, 22.2);
  pop($('follow'), t, 20.1, 22.2, 'translateX(-50%)');
  $('follow').style.top = 250 + 'px';
  const h = $('hand'); h.style.opacity = t > 20.4 && t < 22.1 ? 1 : 0; h.style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * -18}px)`; h.style.top = '318px';
  $('tag').style.opacity = seg(t, 9.5, 10.2) * (1 - seg(t, 22, 22.3)) * (1 - seg(t, 14.0, 14.3) * (1 - seg(t, 19.4, 19.8)));

  // coffee and dates float up around her
  [['e1', 60, 0], ['e2', 420, .4], ['e3', 400, .9]].forEach(([id, x, d]) => {
    const p = seg(t, 12.0 + d, 14.0 + d), el = $(id);
    el.style.opacity = t > 12 + d && t < 14.2 ? Math.sin(p * Math.PI) : 0;
    el.style.left = x + 'px'; el.style.top = (720 - 300 * p) + 'px';
    el.style.transform = `rotate(${Math.sin(t * 4 + d) * 12}deg)`;
  });

  // the car: drives in fast from the right, stops beside her, then zooms off
  const car = $('car');
  const cin = easeOut(seg(t, 14.3, 15.1)), cout = Math.pow(seg(t, 16.5, 17.0), 2);
  const cx = 560 * (1 - cin) - 760 * cout;
  car.style.transform = `scale(1.12) translateX(${cx}px) translateY(${t > 14.3 && t < 15.2 ? Math.sin(t * 60) * 1.5 : 0}px)`;
  car.style.opacity = t > 14.25 && t < 17.1 ? 1 : 0;
  $('speed').style.opacity = (t > 14.3 && t < 15.0) || (t > 16.5 && t < 17) ? 1 : 0;
  const spin = (t * 900) % 360;
  car.querySelector('#wheel1').setAttribute('transform', `rotate(${spin} 85 114)`);
  car.querySelector('#wheel2').setAttribute('transform', `rotate(${spin} 285 114)`);

  // sparkles around the brand card and the follow button
  [...sparks.children].forEach((s) => {
    const i = +s.dataset.i, on = (t > 17.6 && t < 19.4) || (t > 20 && t < 22.1);
    const a = i / 12 * Math.PI * 2 + t * .8, r = 210 + Math.sin(t * 3 + i) * 20;
    s.style.left = 270 + Math.cos(a) * r - 12 + 'px'; s.style.top = 380 + Math.sin(a) * r * .55 + 'px';
    s.style.opacity = on ? (0.5 + 0.5 * Math.sin(t * 6 + i)) : 0;
    s.style.transform = `scale(${0.6 + 0.5 * Math.abs(Math.sin(t * 4 + i))})`;
  });

  // fade out at the very end
  $('stage').style.opacity = 1 - seg(t, 22.2, 22.6);
};
window.DURATION = 26.6;
render(0);
</script>
</body>
</html>
